# 即物穷理 Praxic —— Electron Builder 打包配置
# 用法：npm run electron:build
# 参考：https://www.electron.build/configuration

appId: com.praxic.agent
productName: "即物穷理"
copyright: "Copyright © 2026 Mourpheuon"

# 打包目录：包含 Electron 主进程 + Python 源码
directories:
  output: dist-electron
  buildResources: assets

files:
  # Electron 主进程
  - electron/**/*
  - package.json
  # Python 源码
  - praxic/**/*
  - pyproject.toml
  - config.toml.example
  # 技能包
  - praxic/skills/**/*
  # ── 运行时不需要的内容 ──
  # praxic/web/ 下只保留 index.html，其余全是开发工具
  - "!praxic/web/node_modules"
  - "!praxic/web/node_modules/**"
  - "!praxic/web/src"
  - "!praxic/web/src/**"
  - "!praxic/web/dist"
  - "!praxic/web/dist/**"
  - "!praxic/web/public"
  - "!praxic/web/public/**"
  - "!praxic/web/package.json"
  - "!praxic/web/package-lock.json"
  - "!praxic/web/*.ts"
  - "!praxic/web/*.js"
  - "!praxic/web/*.config.*"
  # Python 编译缓存
  - "!**/__pycache__"
  - "!**/__pycache__/**"
  - "!**/*.pyc"
  - "!**/.git"
  - "!**/.git/**"
  - "!**/.gitkeep"

# 不打包进 asar——Python 需要导入普通文件
asar: false

# macOS 配置
mac:
  category: public.app-category.productivity
  target:
    - dmg
    - zip
  icon: assets/icon.icns
  extendInfo:
    LSEnvironment:
      PRAXIC_PROJECTS_DIR: "~/Documents/PraxicProjects"

# Windows 配置
win:
  target:
    - nsis
  icon: assets/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

# Linux 配置
linux:
  target:
    - AppImage
    - deb
  category: Office
  icon: assets/icon.png

# 发布配置（GitHub Releases）
publish:
  provider: github
