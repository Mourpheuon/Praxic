# 思悟 Agent —— Electron Builder 打包配置
# 用法：npm run electron:build
# 参考：https://www.electron.build/configuration

appId: com.siwu.agent
productName: "思悟 Agent"
copyright: "Copyright © 2026 Mourpheuon"

# 打包目录：包含 Electron 主进程 + Python 源码
directories:
  output: dist-electron
  buildResources: assets

files:
  # Electron 主进程
  - electron/**/*
  - package.json
  # Python 源码（asar:false，保持为可导入的普通文件）
  - siwu/**/*
  - pyproject.toml
  - config.toml.example
  # 技能包
  - siwu/skills/**/*
  # 排除体积大户
  - "!siwu/web/node_modules"
  - "!siwu/web/node_modules/**"
  - "!**/__pycache__"
  - "!**/__pycache__/**"
  - "!**/*.pyc"
  - "!**/.git"
  - "!**/.git/**"
  - "!**/.gitkeep"

# 不打包进 asar——Python 需要导入普通文件
asar: false

# macOS 配置
mac:
  category: public.app-category.productivity
  target:
    - dmg
    - zip
  icon: assets/icon.icns
  extendInfo:
    LSEnvironment:
      SIWU_PROJECTS_DIR: "~/Documents/SiwuProjects"

# Windows 配置
win:
  target:
    - nsis
  icon: assets/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

# Linux 配置
linux:
  target:
    - AppImage
    - deb
  category: Office
  icon: assets/icon.png

# 发布配置（GitHub Releases）
publish:
  provider: github
