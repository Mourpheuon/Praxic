# 即物穷理 Praxic —— Electron Builder 打包配置
# 用法：npm run electron:build
# 参考：https://www.electron.build/configuration

appId: com.praxic.agent
productName: "即物穷理"
copyright: "Copyright © 2026 Mourpheuon"

# 打包目录：包含 Electron 主进程 + Python 源码
directories:
  output: dist-electron
  buildResources: assets

files:
  # Electron 主进程
  - electron/**/*
  - package.json
  # 技能包
  - praxic/skills/**/*
  # ── 运行时不需要的内容 ──
  # 后端已打成自包含 exe（extraResources），不再分发 Python 源码
  # - praxic/**/*
  # - pyproject.toml
  # - config.toml.example
  - "!praxic/web/node_modules"
  - "!praxic/web/node_modules/**"
  - "!praxic/web/src"
  - "!praxic/web/src/**"
  - "!praxic/web/dist"
  - "!praxic/web/dist/**"
  - "!praxic/web/public"
  - "!praxic/web/public/**"
  - "!praxic/web/package.json"
  - "!praxic/web/package-lock.json"
  - "!praxic/web/*.ts"
  - "!praxic/web/*.js"
  - "!praxic/web/*.config.*"
  # Python 编译缓存
  - "!**/__pycache__"
  - "!**/__pycache__/**"
  - "!**/*.pyc"
  - "!**/.git"
  - "!**/.git/**"
  - "!**/.gitkeep"

# 打包后的 Python 后端 exe（PyInstaller 产物）随安装包分发。
# Electron 生产模式会从 resources/backend/praxic-backend(.exe) 启动它，
# 见 electron/main.js -> resolveBackendExecutable()。
extraResources:
  - from: dist/praxic-backend.exe
    to: backend/praxic-backend.exe
    filter: ["**/*"]

# 不打包进 asar——Python 需要导入普通文件
asar: false

# macOS 配置（未签名：无 Apple Developer 证书，用户首次打开需右键→打开）
mac:
  category: public.app-category.productivity
  target:
    - dmg
    - zip
  icon: assets/icon.icns
  identity: null
  extendInfo:
    LSEnvironment:
      PRAXIC_PROJECTS_DIR: "~/Documents/PraxicProjects"

# Windows 配置
win:
  target:
    - nsis
  icon: assets/icon.ico
  # Local builds are unsigned. Skipping executable resource signing avoids
  # requiring Windows symlink privileges just to unpack winCodeSign.
  signAndEditExecutable: false

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

# Linux 配置
linux:
  target:
    - AppImage
    - deb
  category: Office
  icon: assets/icon.png
  executableName: praxic

# 发布配置（GitHub Releases）
publish:
  provider: github
