      { id: 'medium', label: '中', css: '16px' },
      { id: 'large',  label: '大', css: '18px' },
    ];

    function SettingsDialog({ uiSettings, onSave, onClose, availableModels, devMode, setDevMode }) {
      const [activeTab, setActiveTab] = useState('general');
      // ── 通用 (General) ──
      const [persona, setPersona] = useState(uiSettings.agent_persona || '');
      const [knowledge, setKnowledge] = useState(uiSettings.custom_knowledge || '');
      const [phaseModels, setPhaseModels] = useState(uiSettings.phase_models || {});
      const [showThinking, setShowThinking] = useState(uiSettings.show_thinking_after_answer !== false);
      const [maxIterations, setMaxIterations] = useState(uiSettings.max_iterations || 0);
      const [practiceRounds, setPracticeRounds] = useState(uiSettings.practice_rounds || 0);
      const [searchMaxResults, setSearchMaxResults] = useState(uiSettings.web_search_max_results || 0);
      const [fetchMaxUrls, setFetchMaxUrls] = useState(uiSettings.web_fetch_max_urls || 0);
      const [fetchMaxCharsPerPage, setFetchMaxCharsPerPage] = useState(uiSettings.web_fetch_max_chars_per_page || 0);
      const [fetchMaxTotalChars, setFetchMaxTotalChars] = useState(uiSettings.web_fetch_max_total_chars || 0);
      // ── 外观 (Appearance) ──
      const [fontFamily, setFontFamily] = useState(uiSettings.font_family || 'system');
      const [fontSize, setFontSize] = useState(uiSettings.font_size || 'medium');
      const [pageZoom, setPageZoom] = useState(uiSettings.page_zoom || 100);
      // ── 账户 (Account) ──
      const [provider, setProvider] = useState('deepseek');
      const [baseUrl, setBaseUrl] = useState('');
      const [apiKey, setApiKey] = useState('');
      const [model, setModel] = useState('');
      const [showKey, setShowKey] = useState(false);
      const [testing, setTesting] = useState(false);
      const [testResult, setTestResult] = useState(null);
      const [accountSaving, setAccountSaving] = useState(false);
      const [accountModels, setAccountModels] = useState([]);
      const [saving, setSaving] = useState(false);
      // Per-provider key cache — each provider remembers its own key while dialog is open
      const providerKeys = useRef({});
      // ── 更新 (Updates, in About tab) ──
      const [versionInfo, setVersionInfo] = useState(null);
      const [versionLoading, setVersionLoading] = useState(false);
      const [versionError, setVersionError] = useState('');
      const [autoCheckUpdates, setAutoCheckUpdates] = useState(() => {
        try { return JSON.parse(localStorage.getItem('praxic_update_prefs'))?.autoCheck !== false; }
        catch { return true; }
      });
      const [autoInstallUpdates, setAutoInstallUpdates] = useState(() => {
        try { return JSON.parse(localStorage.getItem('praxic_update_prefs'))?.autoInstall === true; }
        catch { return false; }
      });
      const saveUpdatePrefs = useCallback((ac, ai) => {
        try { localStorage.setItem('praxic_update_prefs', JSON.stringify({ autoCheck: ac, autoInstall: ai })); } catch {}
      }, []);

      // ── Build state (dev mode) ──
      const [buildLog, setBuildLog] = useState([]);
      const [buildRunning, setBuildRunning] = useState(false);
      const [buildResult, setBuildResult] = useState(null);
      const [releaseVersion, setReleaseVersion] = useState('');
      const [existingExe, setExistingExe] = useState(null); // {name, size_mb} or null
      const [suggestedVersion, setSuggestedVersion] = useState('');

      // Check for existing .exe when version input changes
      useEffect(() => {
        const v = releaseVersion.trim();
        if (!v) { setExistingExe(null); return; }
        const timer = setTimeout(() => {
          fetch('/api/v1/setup/release-check?version=' + encodeURIComponent(v))
            .then(r => r.json()).then(d => {
              setExistingExe(d.exists ? d.files[0] : null);
              if (d.suggested_version) setSuggestedVersion(d.suggested_version);
            }).catch(() => setExistingExe(null));
        }, 400);
        return () => clearTimeout(timer);
      }, [releaseVersion]);

      // Fetch suggested version on mount (even before version is entered)
      useEffect(() => {
        fetch('/api/v1/setup/release-check')
          .then(r => r.json()).then(d => {
            if (d.suggested_version) setSuggestedVersion(d.suggested_version);
          }).catch(() => {});
      }, []);

      // Auto-fill releaseVersion from versionInfo once it loads
      const releaseVersionSeeded = useRef(false);
      useEffect(() => {
        if (!releaseVersionSeeded.current && versionInfo) {
          const v = versionInfo.electron_version || versionInfo.python_version || '';
          if (v) { setReleaseVersion(v); releaseVersionSeeded.current = true; }
        }
      }, [versionInfo]);

      const isElectronShell = typeof window !== 'undefined' && !!(window.praxic);

      const handleBuild = useCallback(async (skipBuild = false) => {
        setBuildLog([]); setBuildResult(null); setBuildRunning(true);
        try {
          const r = await fetch('/api/v1/setup/build-electron', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ release_version: releaseVersion.trim(), skip_build: skipBuild }),
          });
          const reader = r.body.getReader();
          const decoder = new TextDecoder();
          let buf = '';
          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buf += decoder.decode(value, { stream: true });
            const lines = buf.split('\n');
            buf = lines.pop();
            for (const line of lines) {
              if (line.startsWith('data: ')) {
                try {
                  const data = JSON.parse(line.slice(6));
                  if (data.type === 'log') {
                    setBuildLog(prev => [...prev, data.line]);
                  } else if (data.type === 'error') {
                    setBuildLog(prev => [...prev, `❌ ${data.message}`]);
                  } else if (data.type === 'status') {
                    // status used for phase transitions, heartbeat for keepalive
                  } else if (data.type === 'result') {
                    setBuildResult(data);
                  }
                } catch {}
              }
            }
          }
        } catch (e) {
          setBuildResult({ ok: false, error: '网络请求失败: ' + (e.message || '') });
        } finally {
          setBuildRunning(false);
        }
      }, [releaseVersion]);

      // ── Load LLM config & models on mount ──
      useEffect(() => {
        fetch('/api/v1/setup/config').then(r => r.json()).then(d => {
          const pk = d.provider_key || 'deepseek';
          setProvider(pk);
          setBaseUrl(d.base_url || PROVIDERS[pk]?.url || '');
          setModel(d.model || PROVIDERS[pk]?.model || '');
          if (d.api_key) {
            providerKeys.current[pk] = d.api_key;
            setApiKey(d.api_key);
          }
        }).catch(() => {});
        fetchModelsForProvider('');
      }, []);

      // ── Sync general state from props on mount ──
      // useState init captures the prop at first render; if the parent's
      // uiSettings arrives later (after server fetch), the dialog won't see
      // it without explicit sync. This effect runs once after mount and
      // pulls the latest prop values, fixing truncated text on restart.
      const syncedRef = useRef(false);
      useEffect(() => {
        if (!syncedRef.current && uiSettings.agent_persona) {
          setPersona(uiSettings.agent_persona);
          setKnowledge(uiSettings.custom_knowledge || '');
          setPhaseModels(uiSettings.phase_models || {});
          setShowThinking(uiSettings.show_thinking_after_answer !== false);
          setMaxIterations(uiSettings.max_iterations || 0);
          setPracticeRounds(uiSettings.practice_rounds || 0);
          setSearchMaxResults(uiSettings.web_search_max_results || 0);
          setFetchMaxUrls(uiSettings.web_fetch_max_urls || 0);
          setFetchMaxCharsPerPage(uiSettings.web_fetch_max_chars_per_page || 0);
          setFetchMaxTotalChars(uiSettings.web_fetch_max_total_chars || 0);
          setFontFamily(uiSettings.font_family || 'system');
          setFontSize(uiSettings.font_size || 'medium');
          setPageZoom(uiSettings.page_zoom || 100);
          syncedRef.current = true;
        }
      }, [uiSettings]);

      // ── Fetch version info when updates tab is opened ──
      const fetchVersionInfo = useCallback(() => {
        setVersionLoading(true); setVersionError('');
        fetch('/api/v1/setup/version').then(r => r.json()).then(d => {
          setVersionInfo(d); setVersionLoading(false);
        }).catch(e => {
          setVersionError('获取版本信息失败: ' + (e.message || '网络错误'));
          setVersionLoading(false);
        });
      }, []);

      // Fetch version info when about tab is opened (if auto-check is on)
      useEffect(() => {
        if (activeTab === 'about' && !versionInfo && !versionLoading && autoCheckUpdates) {
          fetchVersionInfo();
        }
      }, [activeTab, versionInfo, versionLoading, fetchVersionInfo, autoCheckUpdates]);

      const fetchModelsForProvider = useCallback((pk) => {
        const q = pk ? '?provider_key=' + encodeURIComponent(pk) : '';
        fetch('/api/v1/models' + q).then(r => r.json()).then(d => {
          setAccountModels(d.models || []);
        }).catch(() => {});
      }, []);

      const handleProviderChange = useCallback((p) => {
        // Save current key for current provider
        if (apiKey.trim()) {
          providerKeys.current[provider] = apiKey;
        }
        setProvider(p);
        const preset = PROVIDERS[p];
        setBaseUrl(preset.url);
        setModel(preset.model);
        // Restore key for the new provider (or blank if never entered)
        setApiKey(providerKeys.current[p] || '');
        setTestResult(null);
        fetchModelsForProvider(p);
      }, [provider, apiKey, fetchModelsForProvider]);

      // ── Test connection ──
      const handleTest = useCallback(async () => {
        if (!apiKey.trim()) { setTestResult({ ok: false, error: '请先输入 API Key' }); return; }
        setTesting(true); setTestResult(null);
        try {
          const r = await fetch('/api/v1/setup/test', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ provider, base_url: baseUrl, api_key: apiKey, model }),
          });
          const d = await r.json();
          setTestResult(d);
        } catch (e) {
          setTestResult({ ok: false, error: '网络请求失败：' + (e.message || '') });
        } finally { setTesting(false); }
      }, [provider, baseUrl, apiKey, model]);

      // ── Save account config ──
      const handleAccountSave = useCallback(async () => {
        if (!apiKey.trim()) return;
        setAccountSaving(true);
        try {
          await fetch('/api/v1/setup', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ provider, base_url: baseUrl, api_key: apiKey, model }),
          });
          // Remember this key for the current provider
          providerKeys.current[provider] = apiKey;
          fetch('/api/v1/models').then(r => r.json()).catch(() => {});
          setTestResult({ ok: true, latency_ms: 0, model, message: '配置已保存' });
        } catch (e) {
          setTestResult({ ok: false, error: '保存失败：' + (e.message || '') });
        } finally { setAccountSaving(false); }
      }, [provider, baseUrl, apiKey, model]);

      // ── Save general/appearance settings ──
      const handleSave = useCallback(async () => {
        setSaving(true);
        try {
          const body = { font_family: fontFamily, font_size: fontSize, page_zoom: pageZoom, show_thinking_after_answer: showThinking, agent_persona: persona, custom_knowledge: knowledge, phase_models: phaseModels, max_iterations: maxIterations, practice_rounds: practiceRounds, web_search_max_results: searchMaxResults, web_fetch_max_urls: fetchMaxUrls, web_fetch_max_chars_per_page: fetchMaxCharsPerPage, web_fetch_max_total_chars: fetchMaxTotalChars };
          const r = await fetch('/api/v1/settings', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
          if (r.ok) onSave(body);
        } catch {} finally { setSaving(false); }
        onClose();
      }, [fontFamily, fontSize, pageZoom, showThinking, maxIterations, practiceRounds, searchMaxResults, fetchMaxUrls, fetchMaxCharsPerPage, fetchMaxTotalChars, persona, knowledge, phaseModels, onSave, onClose]);

      const applyFont = useCallback((fam, sz) => {
        const f = FONT_FAMILIES.find(x => x.id === fam);
        const s = FONT_SIZES.find(x => x.id === sz);
        document.documentElement.style.setProperty('--app-font', (f || FONT_FAMILIES[0]).css);
        document.documentElement.style.setProperty('--app-font-size', (s || FONT_SIZES[1]).css);
      }, []);

      const handleTabFill = useCallback((e, currentValue, setter) => {
        if (e.key === 'Tab' && !currentValue.trim()) {
          const ph = e.target.placeholder || '';
          const idx = ph.indexOf('例：');
          if (idx >= 0) { e.preventDefault(); setter(ph.slice(idx + 2).trim()); }
          else if (ph) { e.preventDefault(); setter(ph); }
        }
      }, []);

      // ── Dialog resize ──
      const [dlgW, setDlgW] = useState(() => { try { return JSON.parse(localStorage.getItem('praxic_settings_size'))?.w || 560; } catch { return 560; } });
      const [dlgH, setDlgH] = useState(() => { try { return JSON.parse(localStorage.getItem('praxic_settings_size'))?.h || 560; } catch { return 560; } });
      const resizeRef = useRef(null);
      const dlgSizeRef = useRef({ w: 560, h: 560 });
      dlgSizeRef.current = { w: dlgW, h: dlgH };
      const resizeStart = useCallback((edge, e) => {
        e.preventDefault();
        resizeRef.current = { edge, sx: e.clientX, sy: e.clientY, sw: dlgW, sh: dlgH };
        const onMove = (ev) => {
          const r = resizeRef.current; if (!r) return;
          if (r.edge.includes('e')) setDlgW(Math.max(500, r.sw + (ev.clientX - r.sx)));
          if (r.edge.includes('s')) setDlgH(Math.max(400, r.sh + (ev.clientY - r.sy)));
        };
        const onUp = () => { document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); resizeRef.current = null;
          try { localStorage.setItem('praxic_settings_size', JSON.stringify(dlgSizeRef.current)); } catch {} };
        document.addEventListener('mousemove', onMove); document.addEventListener('mouseup', onUp);
      }, [dlgW, dlgH]);

      const TABS = [
        { id: 'general', label: '通用', icon: '⚙️' },
        { id: 'appearance', label: '外观', icon: '🎨' },
        { id: 'account', label: '账户', icon: '🔑' },
        { id: 'about', label: '关于', icon: 'ℹ️' },
      ];

      return (
        <div className="praxic-settings-overlay fixed inset-0 z-50 flex items-start justify-center pt-[8vh] bg-black/20 overflow-hidden" onClick={onClose}>
          <div className="praxic-settings relative bg-cream rounded-xl border border-linen/60 shadow-2xl p-0 my-8 overflow-hidden flex flex-col" style={{ width: dlgW, height: dlgH, maxWidth: '96vw', maxHeight: '90vh' }} onClick={e => e.stopPropagation()}>
            {/* Resize handles */}
            <div className="absolute top-0 right-0 w-2 h-full cursor-e-resize hover:bg-seal/10 z-10" onMouseDown={e => resizeStart('e', e)} />
            <div className="absolute bottom-0 left-0 w-full h-2 cursor-s-resize hover:bg-seal/10 z-10" onMouseDown={e => resizeStart('s', e)} />
            <div className="absolute bottom-0 right-0 w-4 h-4 cursor-se-resize z-10" onMouseDown={e => resizeStart('se', e)}>
              <svg width="12" height="12" className="absolute bottom-0.5 right-0.5 text-clay/50"><path d="M0 12 L12 0" stroke="currentColor" strokeWidth="1.5"/><path d="M5 12 L12 5" stroke="currentColor" strokeWidth="1.5"/><path d="M10 12 L12 10" stroke="currentColor" strokeWidth="1.5"/></svg>
            </div>
            {/* Header */}
            <div className="px-6 pt-5 pb-3 flex-shrink-0">
              <h2 className="text-lg font-semibold text-ink font-display">设置</h2>
            </div>
            {/* Body: sidebar + content */}
            <div className="flex flex-1 overflow-hidden min-h-0">
              {/* Sidebar */}
              <div className="w-32 flex-shrink-0 border-r border-clay/20 flex flex-col py-2 bg-cream/50">
                {TABS.map(t => (
                  <button key={t.id} onClick={() => setActiveTab(t.id)}
                    className={'px-3 py-2.5 text-xs font-medium text-left transition-colors border-l-2 ' + (activeTab === t.id ? 'border-seal text-seal bg-seal-wash/50' : 'border-transparent text-warmgray hover:text-ink hover:bg-clay/10')}>
                    <span className="mr-1.5">{t.icon}</span>{t.label}
                  </button>
                ))}
              </div>
              {/* Content */}
              <div className="flex-1 overflow-y-auto px-5 py-4 scrollbar-thin">
              {/* ═══ 通用 ═══ */}
              {activeTab === 'general' && (
                <div className="space-y-5">
                  {/* Agent 角色 */}
                  <div>
                    <div className="text-sm font-medium text-ink mb-1.5">Agent 角色设定</div>
                    <div className="text-xs text-warmgray mb-2">设定 Agent 的身份、语气、思维倾向与行为准则。会被注入到每一轮认知循环中。</div>
                    <textarea value={persona} onChange={e => setPersona(e.target.value)} onKeyDown={e => handleTabFill(e, persona, setPersona)}
                      className="w-full h-32 px-3 py-2 rounded-lg border border-clay/30 bg-white text-sm text-ink placeholder-warmgray resize-y focus:outline-none focus:ring-2 focus:ring-seal/20"
                      placeholder="例：你是一个严谨的分析助手，以马克思主义政治经济学为框架思考问题。优先使用数据和逻辑论证，避免主观臆断。回答风格简练。" />
                  </div>
                  {/* 知识/经验 */}
                  <div>
                    <div className="text-sm font-medium text-ink mb-1.5">重要知识 / 经验</div>
                    <div className="text-xs text-warmgray mb-2">用户想长期保存的关键信息、背景知识或行为偏好。Agent 在处理问题时会参考这些内容。</div>
                    <textarea value={knowledge} onChange={e => setKnowledge(e.target.value)} onKeyDown={e => handleTabFill(e, knowledge, setKnowledge)}
                      className="w-full h-32 px-3 py-2 rounded-lg border border-clay/30 bg-white text-sm text-ink placeholder-warmgray resize-y focus:outline-none focus:ring-2 focus:ring-seal/20"
                      placeholder="例：我是一名独立开发者，关注 AI 基础设施方向。团队使用 React + Python FastAPI 技术栈。代码注释和文档要求使用中文。" />
                  </div>
                  {/* 显示思维过程 */}
                  <div>
                    <div className="text-sm font-medium text-ink mb-1.5">已回答问题的思维过程</div>
                    <div className="text-xs text-warmgray mb-2">Agent 回答后，是否在回答上方保留可展开的认知过程。关闭后界面更简洁。</div>

                    <a href="https://github.com/Mourpheuon/Praxic" target="_blank"
                      className="inline-block text-xs text-seal hover:text-seal-light underline">
                      GitHub · Mourpheuon/Praxic
                    </a>
                  </div>

                  <p className="text-[10px] text-warmgray/40 text-center leading-relaxed">
                    实践不是"像人一样行动"，而是在现实社会关系中<br/>
                    造成可检验、可负责、可反馈的改变。
                  </p>
                </div>
              )}
              </div>
            </div>
            {/* Footer */}
            <div className="px-6 py-4 border-t border-clay/20 flex gap-3 flex-shrink-0 bg-cream">
              <button onClick={onClose} className="flex-1 py-2 rounded-lg border border-clay/40 text-warmgray text-sm hover:bg-clay/10 transition-colors">取消</button>
              {activeTab !== 'account' && (
                <button onClick={handleSave} disabled={saving} className="flex-1 py-2 rounded-lg bg-seal text-white text-sm font-semibold hover:bg-seal-light transition-colors disabled:opacity-50">{saving ? '保存中…' : '保存'}</button>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ── Provider presets ─────────────────────────────────────
    const PROVIDERS = {
      deepseek:  { label: 'DeepSeek',     url: 'https://api.deepseek.com',         model: 'deepseek-v4-pro' },
      openai:    { label: 'OpenAI',       url: 'https://api.openai.com/v1',         model: 'gpt-4o' },
      anthropic: { label: 'Anthropic Claude', url: 'https://api.anthropic.com',    model: 'claude-sonnet-4-5' },
      ollama:    { label: 'Ollama 本地',  url: 'http://localhost:11434/v1',         model: 'llama3' },
      custom:    { label: '自定义 / 中转站', url: '',                                 model: '' },
    };

    // ── SetupScreen ──────────────────────────────────────────
    function SetupScreen({ onConfigured }) {
      const [provider, setProvider] = useState('deepseek');
      const [baseUrl, setBaseUrl] = useState(PROVIDERS.deepseek.url);
      const [apiKey, setApiKey] = useState('');
      const [model, setModel] = useState(PROVIDERS.deepseek.model);
      const [saving, setSaving] = useState(false);
      const [error, setError] = useState('');
      const [showKey, setShowKey] = useState(false);

      const handleProviderChange = useCallback((p) => {
        setProvider(p); setBaseUrl(PROVIDERS[p].url); setModel(PROVIDERS[p].model); setError('');
      }, []);
      const handleTabFill = useCallback((e, currentValue, setter) => {
        if (e.key === 'Tab' && !currentValue.trim()) {
          const ph = e.target.placeholder || '';
          if (ph) { e.preventDefault(); setter(ph); }
        }
      }, []);
      const handleSave = useCallback(async () => {
        if (!apiKey.trim()) { setError('请输入 API Key'); return; }
        setSaving(true); setError('');
        try {
          const res = await fetch('/api/v1/setup', { method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ provider, base_url: baseUrl, api_key: apiKey, model }) });
          if (!res.ok) { const d = await res.json(); throw new Error(d.detail || '保存失败'); }
          onConfigured();
        } catch (err) { setError(err.message); } finally { setSaving(false); }
      }, [apiKey, provider, baseUrl, model, onConfigured]);

      return (
        <div className="min-h-screen bg-paper flex items-center justify-center p-8">
          <div className="w-full max-w-lg">
            <div className="text-center mb-8">
              <h1 className="text-3xl font-bold text-seal font-display"><BrandMark size={56} className="mx-auto mb-3" />Praxic</h1>
              <p className="text-sm text-warmgray mt-2 font-display">Agent</p>
              <p className="text-xs text-warmgray mt-4">Praxic AI 智能体<br/>首次使用，请配置 LLM 连接</p>
            </div>
            <div className="bg-cream border border-linen/50 rounded-xl p-6 space-y-5 shadow-lg">
              <div><label className="block text-xs font-semibold text-warmgray mb-2 uppercase">服务商</label>
                <div className="flex flex-wrap gap-2">
                  {Object.entries(PROVIDERS).map(([k,v]) => (
                    <button key={k} onClick={() => handleProviderChange(k)} className={'px-3 py-1.5 rounded-full text-xs font-medium transition-colors ' + (provider===k ? 'bg-seal text-white' : 'bg-paper border border-clay/40 text-warmgray hover:border-seal/40')}>{v.label}</button>
                  ))}
                </div>
              </div>
              <div><label className="block text-xs font-semibold text-warmgray mb-1.5 uppercase">Base URL</label>
                <input value={baseUrl} onChange={e=>setBaseUrl(e.target.value)} onKeyDown={e => handleTabFill(e, baseUrl, setBaseUrl)} placeholder="https://api.deepseek.com" className="w-full bg-paper border border-linen/60 rounded-lg px-4 py-2.5 text-sm text-ink placeholder:text-clay focus:outline-none focus:border-seal/50 focus:ring-1 focus:ring-seal/20" /></div>
              <div><label className="block text-xs font-semibold text-warmgray mb-1.5 uppercase">API Key</label>
                <div className="relative">
                  <input type={showKey?'text':'password'} value={apiKey} onChange={e=>{setApiKey(e.target.value);setError('');}} placeholder="sk-…" className="w-full bg-paper border border-linen/60 rounded-lg px-4 py-2.5 pr-10 text-sm text-ink placeholder:text-clay focus:outline-none focus:border-seal/50 focus:ring-1 focus:ring-seal/20" />
                  <button onClick={()=>setShowKey(!showKey)} className="absolute right-3 top-1/2 -translate-y-1/2 text-xs text-warmgray hover:text-seal">{showKey?'🙈':'👁'}</button>
                </div>
              </div>
              <div><label className="block text-xs font-semibold text-warmgray mb-1.5 uppercase">Model</label>
                <input value={model} onChange={e=>setModel(e.target.value)} onKeyDown={e => handleTabFill(e, model, setModel)} placeholder="deepseek-v4-pro" className="w-full bg-paper border border-linen/60 rounded-lg px-4 py-2.5 text-sm text-ink placeholder:text-clay focus:outline-none focus:border-seal/50 focus:ring-1 focus:ring-seal/20" /></div>
              {error && <div className="text-sm text-red-700 bg-red-50 border border-red-200 rounded-lg px-4 py-2.5">{error}</div>}
              <button onClick={handleSave} disabled={saving||!apiKey.trim()} className="w-full py-3 rounded-lg bg-seal text-white text-sm font-semibold hover:bg-seal-light transition-colors disabled:opacity-40 disabled:cursor-not-allowed">{saving?'保存中…':'✓ 保存并进入'}</button>
              <p className="text-[10px] text-warmgray/60 text-center">配置将写入 config.toml，密钥仅存储于本地</p>
            </div>
          </div>
        </div>
      );
    }

    // ── App ──────────────────────────────────────────────────
    function App() {
      const [activeConvId, setActiveConvId] = useState(() => {
        try { return JSON.parse(localStorage.getItem(LS_KEY))?.lastConvId || ''; } catch { return ''; }
      });
      const [turns, setTurns] = useState([]);
      const [devMode, setDevMode] = useState(() => {
        try { return JSON.parse(localStorage.getItem('praxic_dev_mode')) === true; }
        catch { return false; }
      });
      const [showSettings, setShowSettings] = useState(false);
      const [uiSettings, setUiSettings] = useState({ font_family: 'system', font_size: 'medium', page_zoom: 100, show_thinking_after_answer: true, agent_persona: '', custom_knowledge: '' });
      const [animTitleId, setAnimTitleId] = useState(null);  // conversation id that just got a title
      const [selectedModel, setSelectedModel] = useState(() => { try { return localStorage.getItem('praxic_selected_model') || '智能路由'; } catch { return '智能路由'; } });
      const [availableModels, setAvailableModels] = useState(['智能路由']);
      const [projects, setProjects] = useState([]);
      const [activeProjectId, setActiveProjectId] = useState(() => {
        try {
          const saved = JSON.parse(localStorage.getItem(LS_KEY)) || {};
          return Object.prototype.hasOwnProperty.call(saved, 'activeProjectId') ? saved.activeProjectId : null;
        } catch { return null; }
      });
      const [sessionSort, setSessionSort] = useState(() => {
        try { return localStorage.getItem('praxic_session_sort') || 'recent'; } catch { return 'recent'; }
      });
      const [projectDialog, setProjectDialog] = useState(null);

      // ── File upload (lifted to App for page-wide drag-and-drop) ──
      const [files, setFiles] = useState([]);
      const [uploading, setUploading] = useState(false);
      const [dragOver, setDragOver] = useState(false);
      const dragCounterRef = useRef(0);
      const activeProjectRef = useRef('');

      const handleFiles = useCallback(async (fileList) => {
        const arr = Array.from(fileList || []);
        if (!arr.length) return;
        setUploading(true);
        try {
          for (const f of arr) {
            try {
              const fd = new FormData();
              fd.append('file', f);
              fd.append('project_id', activeProjectRef.current || '');
              const r = await fetch('/api/v1/agent/upload-file', { method: 'POST', body: fd });
              if (!r.ok) {
                const errText = await r.text().catch(() => String(r.status));
                console.error('[upload] server error:', r.status, errText);
                continue;
              }
              const data = await r.json();
              if (data.file_path) setFiles(prev => [...prev, { name: data.file_name || f.name, path: data.file_path }]);
            } catch (e) { console.error('[upload] error:', e); }
          }
        } finally {
          setUploading(false);
        }
      }, []);

      const handleDragOver = useCallback((e) => {
        e.preventDefault(); e.stopPropagation();
      }, []);
      const handleDragEnter = useCallback((e) => {
        e.preventDefault(); e.stopPropagation();
        dragCounterRef.current += 1;
        setDragOver(true);
      }, []);
      const handleDragLeave = useCallback((e) => {
        e.preventDefault(); e.stopPropagation();
        dragCounterRef.current -= 1;
        if (dragCounterRef.current <= 0) { dragCounterRef.current = 0; setDragOver(false); }
      }, []);
      const handleDrop = useCallback((e) => {
        e.preventDefault(); e.stopPropagation();
        dragCounterRef.current = 0;
        setDragOver(false);
        const dt = e.dataTransfer;
        if (dt && dt.files && dt.files.length) handleFiles(dt.files);
      }, [handleFiles]);

      // Phase tracking for the current in-progress turn
      const [activePhase, setActivePhase] = useState(null);
      const [completedPhases, setCompletedPhases] = useState(() => new Set());
      const [phaseLogs, setPhaseLogs] = useState([]);
      const [historyProcessOpen, setHistoryProcessOpen] = useState({});
      const [editRequest, setEditRequest] = useState(null);
      const [copiedTurnKey, setCopiedTurnKey] = useState('');
      const copyResetRef = useRef(null);
      const [steeringCount, setSteeringCount] = useState(0);
      const [clarify, setClarify] = useState(null);  // { convId, questions } | null —— 智能体主动提问（澄清）
      const [authorizationByConv, setAuthorizationByConv] = useState({});
      const [authorizationBusy, setAuthorizationBusy] = useState('');
      const [authorizationError, setAuthorizationError] = useState('');

      useEffect(() => {
        setEditRequest(null);
      }, [activeConvId]);

      useEffect(() => () => {
        if (copyResetRef.current) clearTimeout(copyResetRef.current);
      }, []);

      const { list, setList: setListDirect, refresh, create, rename, remove, pin, loadTurns } = useConversations();
      const { runningConvs, start, stop, attach } = useSSE();
      const running = runningConvs.has(activeConvId);
      const activeAuthorization = authorizationByConv[activeConvId] || null;
      const refreshProjects = useCallback(async () => {
        try {
          const r = await fetch('/api/v1/projects');
          if (!r.ok) return [];
          const data = await r.json();
          const next = data?.projects || [];
          setProjects(next);
          return next;
        } catch (e) {
          console.error('[projects] refresh error:', e);
          return [];
        }
      }, []);

      useEffect(() => {
        try { localStorage.setItem('praxic_session_sort', sessionSort); } catch {}
      }, [sessionSort]);

      useEffect(() => { refreshProjects(); }, [refreshProjects]);

      const activeConversation = (list || []).find(c => c.id === activeConvId);
      activeProjectRef.current = activeConversation?.project_id || (activeProjectId === null ? '' : activeProjectId);

      const sortedConversations = useMemo(() => {
        const convs = [...(list || [])];
        const pinned = convs.filter(c => c.pinned);
        const regular = convs.filter(c => !c.pinned);
        if (sessionSort === 'oldest') return [...pinned, ...regular.reverse()];
        if (sessionSort !== 'by_project') return [...pinned, ...regular];

        const projectMap = new Map((projects || []).map(project => [project.id, project]));
        const grouped = new Map();
        for (const conversation of regular) {
          const pid = conversation.project_id || '';
          if (!grouped.has(pid)) grouped.set(pid, []);
          grouped.get(pid).push(conversation);
        }
        const orderedIds = [
          ...(projects || []).map(project => project.id),
          ...Array.from(grouped.keys()).filter(pid => !(projects || []).some(project => project.id === pid)),
        ];
        const result = [];
        for (const pid of orderedIds) {
          const items = grouped.get(pid);
          if (!items?.length) continue;
          const project = projectMap.get(pid);
          result.push({
            type: 'group_header',
            pid,
            label: project?.name || (pid ? '未命名项目' : '默认项目'),
          });
          result.push(...items);
        }
        return [...pinned, ...result];
      }, [list, projects, sessionSort]);
      const stopCurrent = useCallback(async () => {
        const cid = activeConvRef.current;
        if (!cid) return;
        // 1. 通知后端终止认知循环
        try {
          await fetch('/api/v1/agent/control', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ conversation_id: cid, action: 'stop' }),
          });
        } catch (e) { console.error('[stop] control API error:', e); }
        // 2. 关闭 SSE 连接
        stop(cid);
        setAuthorizationByConv(prev => ({ ...prev, [cid]: null }));
      }, [stop]);
      const handleSteer = useCallback(async (content, anchorEntry = null) => {
        const cid = activeConvRef.current;
        if (!cid) { console.warn('[steer] no active conversation, ignoring'); return false; }
        try {
          const r = await fetch('/api/v1/agent/control', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ conversation_id: cid, action: 'steer', content, target_phase: '' }),
          });
          if (!r.ok) {
            const d = await r.json().catch(() => ({}));
            console.warn('[steer] failed:', d.detail);
            return false;
          } else {
            console.log('[steer] sent to', cid, ':', content.slice(0, 60));
          }
          const previous = steeringHistoryRef.current.slice();
          steeringHistoryRef.current = [...previous, content];
          setSteeringCount(steeringHistoryRef.current.length);
          recordPhaseEvent(cid, anchorEntry?.phase || activePhaseRef.current || 'practice', '用户插话：' + content, {
            event_type: 'steering', content, previous_count: previous.length,
            previous_steering: previous.slice(-5),
          });
          return true;
        } catch (e) { console.error('[steer] error:', e); return false; }
      }, []);
      const submitAnswer = useCallback(async (answer) => {
        const cid = activeConvRef.current;
        if (!cid) return;
        try {
          await fetch('/api/v1/agent/control', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ conversation_id: cid, action: 'answer', content: answer || '' }),
          });
        } catch (e) { console.error('[answer] error:', e); }
        setClarify(null);
      }, []);
      const resolveAuthorization = useCallback(async (request, action) => {
        const cid = activeConvRef.current;
        if (!cid || !request?.request_id) return;
        setAuthorizationBusy(request.request_id);
        setAuthorizationError('');
        try {
          const r = await fetch('/api/v1/agent/authorizations/' + encodeURIComponent(request.request_id), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action }),
          });
          const data = await r.json();
          if (!r.ok) throw new Error(data.detail || '授权状态更新失败');
          setAuthorizationByConv(prev => ({ ...prev, [cid]: data.authorization || request }));
        } catch (e) {
          setAuthorizationError(e.message || '授权状态更新失败');
        } finally {
          setAuthorizationBusy('');
        }
      }, []);
      const store = useLocalStore();
      const chatRef = useRef(null);

      // Refs to keep async callbacks fresh without re-creating handleSend
      const activeConvRef = useRef(activeConvId);
      activeConvRef.current = activeConvId;
      const turnsRef = useRef(turns);
      turnsRef.current = turns;
      // Ref directly updated in onPhase (NOT via render) to avoid React batching race
      const capturedPhaseLogsRef = useRef([]);
      const activePhaseRef = useRef(null);
      activePhaseRef.current = activePhase;
      const steeringHistoryRef = useRef([]);
      const runningRef = useRef(running);
      runningRef.current = running;
      const renameRef = useRef(rename);
      renameRef.current = rename;
      const refreshRef = useRef(refresh);
      refreshRef.current = refresh;
      const prevActiveConvIdRef = useRef('');
      // Track whether we're mid-send (programmatic setActiveConvId from handleSend)
      const sendingRef = useRef(false);
      // Cache conversation UI state for background-running conversations
      const convStateCacheRef = useRef({});
      const recoveryTimerRef = useRef(null);

      // All streamed events remain in chronological order. Only the UI renderer
      // groups them by phase; this is what keeps WEB_SEARCH/WEB_FETCH inside
      // 调查研究 instead of flattening them into a second phase label.
      const recordPhaseEvent = useCallback((cid, phase, summary, data) => {
        const current = activePhaseRef.current || '';
        const canonical = canonicalPhase(phase, current);
        const entry = {
          id: `${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
          phase: canonical,
          summary: cleanPromptLeakage(summary || ''),
          data: data || null,
          timestamp: new Date().toISOString(),
        };
        const append = previous => [...previous, entry].slice(-300);
        capturedPhaseLogsRef.current = append(capturedPhaseLogsRef.current);

        const previousPhase = activePhaseRef.current;
        if (PHASE_LABELS[canonical]) activePhaseRef.current = canonical;
        const cache = convStateCacheRef.current[cid] || { turns: turnsRef.current, phaseLogs: [], activePhase: null, completedPhases: new Set() };
        cache.activePhase = PHASE_LABELS[canonical] ? canonical : previousPhase;
        if (previousPhase && previousPhase !== canonical) cache.completedPhases = new Set([...cache.completedPhases, previousPhase]);
        cache.phaseLogs = append(cache.phaseLogs || []);
        convStateCacheRef.current[cid] = cache;

        if (activeConvRef.current !== cid) return;
        if (PHASE_LABELS[canonical]) {
          setActivePhase(canonical);
          setCompletedPhases(previous => {
            const next = new Set(previous);
            if (previousPhase && previousPhase !== canonical) next.add(previousPhase);
            return next;
          });
        }
        setPhaseLogs(previous => append(previous));
      }, []);

      // The sidebar always shows every conversation; projects are used for
      // assignment and grouping rather than as a persistent list filter.
      useEffect(() => { refresh(); }, [refresh]);

      // Load available models
      useEffect(() => {
        fetch('/api/v1/models').then(r => r.json()).then(data => {
          if (data?.models?.length) {
            setAvailableModels(data.models);
            // If current selection is not in the list, fall back to 智能路由
            setSelectedModel(prev => data.models.includes(prev) ? prev : '智能路由');
          }
        }).catch(() => {});
      }, []);

      // Load & apply UI settings (font, persona)
      // Phase 1: localStorage instant (no flash on refresh)
      // Phase 2: server (authoritative)
      useEffect(() => {
        try {
          const cached = JSON.parse(localStorage.getItem('praxic_ui_settings'));
          if (cached) {
            setUiSettings(cached);
            const cfa = FONT_FAMILIES.find(x => x.id === cached.font_family);
            const cfs = FONT_SIZES.find(x => x.id === cached.font_size);
            document.documentElement.style.setProperty('--app-font', (cfa || FONT_FAMILIES[0]).css);
            document.documentElement.style.setProperty('--app-font-size', (cfs || FONT_SIZES[1]).css);
            if (cached.page_zoom) document.body.style.zoom = (cached.page_zoom / 100).toString();
          }
        } catch {}
        fetch('/api/v1/settings').then(r => r.json()).then(d => {
          setUiSettings(d);
          try { localStorage.setItem('praxic_ui_settings', JSON.stringify(d)); } catch {}
          const fa = FONT_FAMILIES.find(x => x.id === d.font_family);
          const fs = FONT_SIZES.find(x => x.id === d.font_size);
          document.documentElement.style.setProperty('--app-font', (fa || FONT_FAMILIES[0]).css);
          document.documentElement.style.setProperty('--app-font-size', (fs || FONT_SIZES[1]).css);
          if (d.page_zoom) document.body.style.zoom = (d.page_zoom / 100).toString();
        }).catch(() => {});
      }, []);

      // Load turns when switching conversations
      useEffect(() => {
        const prevId = prevActiveConvIdRef.current;
        prevActiveConvIdRef.current = activeConvId;
        // Save state of conversation we're leaving (if running)
        if (prevId && prevId !== activeConvId && runningConvs.has(prevId)) {
          convStateCacheRef.current[prevId] = {
            turns: turnsRef.current,
            phaseLogs: [...phaseLogs],
            activePhase,
            completedPhases: new Set(completedPhases),
          };
        }
        if (!activeConvId) return;
        if (sendingRef.current) return;
        if (recoveryTimerRef.current) return;  // recovery polling is active
        store.save({ lastConvId: activeConvId });
        // Restore from cache if this conversation is running in background
        const cached = convStateCacheRef.current[activeConvId];
        if (cached && runningConvs.has(activeConvId)) {
          setTurns(cached.turns);
          setPhaseLogs(cached.phaseLogs);
          setActivePhase(cached.activePhase);
          setCompletedPhases(cached.completedPhases);
          return;
        }
        // Otherwise load from DB
        loadTurns(activeConvId).then(historyTurns => {
          const lastTurn = historyTurns[historyTurns.length - 1];
          if (lastTurn && lastTurn.summary === '[...]') {
            // In-progress turn — recovery effect handles it
            return;
          }
          // Filter out placeholder entries ([...]) — they're internal markers
          const cleanTurns = historyTurns.filter(t => t.summary !== '[...]');
          setTurns(cleanTurns.map(historyTurnFromApi));
          setPhaseLogs([]); setActivePhase(null); setCompletedPhases(new Set());
        });
      }, [activeConvId]);

      // ── Post-refresh recovery: SSE reconnection (pub/sub), fallback to polling ──
      useEffect(() => {
        if (recoveryTimerRef.current) { clearInterval(recoveryTimerRef.current); recoveryTimerRef.current = null; }
        if (!activeConvId) return;
        loadTurns(activeConvId).then(async historyTurns => {
          const lastTurn = historyTurns[historyTurns.length - 1];
          // [...]-orphan: conversation was stopped / crashed before saving a real summary.
          // Don't enter recovery — just clean up and show what we have.
          if (!lastTurn || lastTurn.summary !== '[...]') return;
          if (recoveryTimerRef.current) { clearInterval(recoveryTimerRef.current); recoveryTimerRef.current = null; }
          if (!runningConvs.has(activeConvId)) {
            // Backend is no longer running — keep the orphaned turn so its
            // persisted phase logs and steering messages remain inspectable.
            console.log('[recovery] orphaned [...] — showing preserved process');
            setTurns(historyTurns.map(historyTurnFromApi));
            setPhaseLogs([]); setActivePhase(null); setCompletedPhases(new Set());
            return;
          }

          const historyEntries = historyTurns.slice(0, -1).map(historyTurnFromApi);
          const recoveringConvId = activeConvId;

          const startPolling = () => {
            console.log('[recovery] polling for in-progress turn completion');
            setTurns([...historyEntries, { type: 'recovering', question: '正在恢复思考进度...', summary: '', actions: [], files: [] }]);
            let attempts = 0;
            const poll = () => {
              attempts++;
              if (attempts > 40) {  // ~2 minutes max (40 * 3s)
                clearInterval(recoveryTimerRef.current);
                recoveryTimerRef.current = null;
                // Give up — show whatever history we have, clean up the stuck turn
                console.log('[recovery] polling gave up after', attempts, 'attempts');
                setTurns([...historyEntries, { ...historyTurnFromApi(lastTurn || {}), summary: '**会话恢复超时**\n\n后台响应超过 2 分钟，已停止等待。此前已发生的过程仍保留在下方。' }]);
                setPhaseLogs([]);
                refreshRef.current();
                return;
              }
              loadTurns(recoveringConvId).then(fresh => {
                const last = fresh[fresh.length - 1];
                if (last && last.summary !== '[...]') {
                  console.log('[recovery] backend finished via polling');
                  clearInterval(recoveryTimerRef.current);
                  recoveryTimerRef.current = null;
                   const clean = fresh.filter(t => t.summary !== '[...]');
                   setTurns(clean.map(historyTurnFromApi));
                  setPhaseLogs([]);
                  refreshRef.current();
                }
              });
            };
            recoveryTimerRef.current = setInterval(poll, 3000);
          };

          // Step 1: Try SSE reconnection via pub/sub architecture
          try {
            const statusRes = await fetch('/api/v1/agent/run/status/' + encodeURIComponent(recoveringConvId));
            const status = await statusRes.json();
            if (status.status === 'running') {
              console.log('[recovery] SSE stream alive for', recoveringConvId, '— attaching');
              setTurns([...historyEntries, { type: 'turn', question: lastTurn.question, running: true, summary: '', actions: [], files: [] }]);
              setPhaseLogs([]); setActivePhase(null); setCompletedPhases(new Set()); activePhaseRef.current = null;
              steeringHistoryRef.current = []; setSteeringCount(0);
              capturedPhaseLogsRef.current = [];
              attach(recoveringConvId, {
                onPhase: (phase, summary, data) => {
                  if (activeConvRef.current !== recoveringConvId) return;
                  recordPhaseEvent(recoveringConvId, phase, summary, data);
                },
                onClarification: (questions) => {
                  setClarify({ convId: recoveringConvId, questions: questions || [] });
                },
                onAuthorization: (authorization) => {
                  if (authorization?.request_id) {
                    setAuthorizationByConv(prev => ({ ...prev, [recoveringConvId]: authorization }));
                  }
                },
                onDone: (result) => {
                  if (recoveryTimerRef.current) { clearInterval(recoveryTimerRef.current); recoveryTimerRef.current = null; }
                  setActivePhase(null); activePhaseRef.current = null;
                  setClarify(prev => (prev && prev.convId === recoveringConvId) ? null : prev);
                  setAuthorizationByConv(prev => ({ ...prev, [recoveringConvId]: null }));
                  if (result.error === 'attach_failed') { startPolling(); return; }
                  const rawSummary = result.error ? '**运行出错**\n\n' + result.error : (result.summary || '');
                  const summary = cleanPromptLeakage(rawSummary);
                  const actions = result.error ? [] : (result.action_items || []);
                  const resultEntry = { id: `${Date.now()}-result`, phase: 'reflection', summary, data: { event_type: result.error ? 'error' : 'result', result }, timestamp: new Date().toISOString() };
                  const finalPhaseLogs = [...capturedPhaseLogsRef.current, resultEntry];
                  capturedPhaseLogsRef.current = [];
                  setTurns(prev => prev.map((t, i) => i === prev.length - 1 ? { ...t, running: false, summary, actions, phaseLogs: finalPhaseLogs } : t));
                  setPhaseLogs([]);
                refreshRef.current();
                },
              });
              return; // SSE attached — skip polling
            }
          } catch (e) { console.log('[recovery] SSE status check failed:', e); }

          // Step 2: Fallback to polling
          startPolling();
        });
        return () => { if (recoveryTimerRef.current) { clearInterval(recoveryTimerRef.current); recoveryTimerRef.current = null; } };
      }, [activeConvId]);

      // Auto-create conversation if none selected
      // Also inject activeConvId into list if it's missing (e.g. after refresh failure)
      const stuckRecoveryRef = useRef(null);
      useEffect(() => {
        if (!activeConvId) {
          if (list.length === 0) return;
          const firstId = list[0]?.id;
          if (firstId) setActiveConvId(firstId);
          return;
        }
        // activeConvId is set — ensure it appears in sidebar
        if (list.length === 0) {
          // List is empty (API may have failed) — inject a minimal entry
          setListDirect([{ id: activeConvId, name: '(加载中…)', question_count: 0, last_active: new Date().toISOString() }]);
        } else if (!list.find(c => c.id === activeConvId)) {
          // activeConvId not in loaded list — inject it at top
          setListDirect(prev => [{ id: activeConvId, name: '(恢复中…)', question_count: 0, last_active: new Date().toISOString() }, ...prev]);
        }

        // If recovery state persists > 12s with no turns loaded, clear the injection
        // so the user sees the normal welcome screen instead of being stuck forever.
        const isRecovering = list.some(c => c.id === activeConvId && (c.name === '(加载中…)' || c.name === '(恢复中…)'));
        if (isRecovering) {
          if (stuckRecoveryRef.current) clearTimeout(stuckRecoveryRef.current);
          stuckRecoveryRef.current = setTimeout(() => {
            // If turns still empty after 12s, remove the injected entry
            setListDirect(prev => prev.filter(c => !(c.id === activeConvId && (c.name === '(加载中…)' || c.name === '(恢复中…)'))));
            // Clear stuck conversation from localStorage so next refresh doesn't repeat
            try {
              const s = JSON.parse(localStorage.getItem(LS_KEY)) || {};
              if (s.lastConvId === activeConvId) { s.lastConvId = ''; localStorage.setItem(LS_KEY, JSON.stringify(s)); }
            } catch {}
            // Clear activeConvId so the welcome screen shows
            setActiveConvId('');
            // Also stop any polling
            if (recoveryTimerRef.current) { clearInterval(recoveryTimerRef.current); recoveryTimerRef.current = null; }
            console.log('[recovery] timed out after 12s — cleared stuck recovery state');
          }, 12000);
        }
        return () => { if (stuckRecoveryRef.current) clearTimeout(stuckRecoveryRef.current); };
      }, [list, activeConvId, setListDirect]);

      // Auto-scroll to bottom
      useEffect(() => {
        if (chatRef.current) chatRef.current.scrollTop = chatRef.current.scrollHeight;
      }, [turns, phaseLogs]);

      const handleSend = useCallback((question, context, mode, reviewStrategy, model, files, replaceTurnIndex = null, replaceSessionId = '') => {
        console.log('[handleSend] activeConvRef.current:', activeConvRef.current, 'turns.length:', turnsRef.current.length);
        let cid = activeConvRef.current;
        const projectIdForRun = activeConversation ? (activeConversation.project_id || '') : activeProjectRef.current;
        // Prevent double-send on a conversation that's already running
        if (cid && runningConvs.has(cid)) {
          console.log('[handleSend] conv already running, skipping:', cid);
          return;
        }
        const shouldReplaceTurn = Boolean(cid) && Number.isInteger(replaceTurnIndex)
          && replaceTurnIndex >= 0 && replaceTurnIndex < turnsRef.current.length;
        const turnIdx = shouldReplaceTurn ? replaceTurnIndex : turnsRef.current.length;
        sendingRef.current = true;
        const ensureConv = async () => {
          if (!cid) {
            cid = await create(question.slice(0,24), projectIdForRun);
            console.log('[handleSend] created new conv:', cid);
            // Optimistic: insert into sidebar list before refresh completes
            const optimisticEntry = { id: cid, name: question.slice(0, 24), question_count: 0, last_active: new Date().toISOString(), project_id: projectIdForRun };
            setListDirect(prev => [optimisticEntry, ...prev]);
            setActiveConvId(cid);
          } else {
            setActiveConvId(cid);
          }
          // Add user bubble
          const fileInfos = (files || []).map(f => typeof f === 'string' ? { name: f, path: f } : f);
          const filePaths = fileInfos.map(f => f.path);
          const nextTurn = { type: 'turn', question, context, mode, reviewStrategy, model, running: true, summary: '', actions: [], files: fileInfos };
          setTurns(prev => shouldReplaceTurn ? [...prev.slice(0, turnIdx), nextTurn] : [...prev, nextTurn]);
          setPhaseLogs([]); setActivePhase(null); setCompletedPhases(new Set()); activePhaseRef.current = null;
          steeringHistoryRef.current = []; setSteeringCount(0);
          capturedPhaseLogsRef.current = [];  // reset for new turn
          // Release guard now that turns are set
          sendingRef.current = false;

          // Flush React render (sidebar entry + user bubble) before SSE events arrive
          await new Promise(r => setTimeout(r, 30));

          start(question, context, mode, cid, reviewStrategy, model, projectIdForRun, filePaths, {
            onPhase: (phase, summary, data) => {
              recordPhaseEvent(cid, phase, summary, data);
            },
            onDone: (result) => {
              const isActive = activeConvRef.current === cid;
              if (isActive) setActivePhase(null);
              setClarify(prev => (prev && prev.convId === cid) ? null : prev);
              setAuthorizationByConv(prev => ({ ...prev, [cid]: null }));
              const rawSummary = result.error
                ? '**运行出错**\n\n' + result.error
                : (result.summary || '');
              const summary = cleanPromptLeakage(rawSummary);
              const actions = result.error ? [] : (result.action_items || []);
              const generatedFiles = result.error ? [] : (result.generated_files || []);
              // Capture phase logs from the direct ref (always fresh, no React batching race)
              const resultEntry = { id: `${Date.now()}-result`, phase: 'reflection', summary, data: { event_type: result.error ? 'error' : 'result', result }, timestamp: new Date().toISOString() };
              const finalPhaseLogs = [...capturedPhaseLogsRef.current, resultEntry];
              capturedPhaseLogsRef.current = [];
              setTurns(prev => {
                const copy = [...prev];
                if (copy[turnIdx]) copy[turnIdx] = { ...copy[turnIdx], sessionId: result.session_id || copy[turnIdx].sessionId || '', running: false, summary, actions, generatedFiles, phaseLogs: finalPhaseLogs };
                return copy;
              });
              // Also update cache for background-switch recovery
              if (convStateCacheRef.current[cid]) {
                const cachedTurns = convStateCacheRef.current[cid].turns || [];
                const update = t => ({ ...t, sessionId: result.session_id || t.sessionId || '', running: false, summary, actions, generatedFiles, phaseLogs: finalPhaseLogs });
                convStateCacheRef.current[cid].turns = shouldReplaceTurn
                  ? [...cachedTurns.slice(0, turnIdx), update(cachedTurns[turnIdx] || {})]
                  : cachedTurns.map((t, i) => i === turnIdx ? update(t) : t);
              }
              // Trigger MathJax if this conv is active
              if (isActive) {
                setTimeout(() => {
                  if (window.MathJax && window.MathJax.typesetPromise) {
                    window.MathJax.typesetPromise();
                  }
                }, 100);
              }
              refreshRef.current();  // always refresh list (question_count, etc.)
            },
            onClarification: (questions) => {
              setClarify({ convId: cid, questions: questions || [] });
            },
            onAuthorization: (authorization) => {
              if (authorization?.request_id) {
                setAuthorizationByConv(prev => ({ ...prev, [cid]: authorization }));
              }
            },
            replaceSessionId: shouldReplaceTurn ? replaceSessionId : '',
            onTitle: (title, cid) => {
              console.log('[onTitle] title:', title, 'cid:', cid);
              if (cid) {
                renameRef.current(cid, title);  // use ref to ensure latest rename
                // Also optimistically update the list entry's name
                setListDirect(prev => prev.map(c => c.id === cid ? { ...c, name: title } : c));
              }
              setAnimTitleId(cid);
              setTimeout(() => setAnimTitleId(null), 1200);
            },
          });
        };
        ensureConv();
      }, [start, create, runningConvs, activeConversation]);  // runningConvs guards against double-send
      // refresh/rename accessed via refs — no need in deps

      const requestEdit = useCallback((turn, turnIndex) => {
        if (!turn || turn.steer || running) return;
        setEditRequest({
          key: `${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
          turnIndex,
        });
      }, [running]);

      const sendEditedTurn = useCallback((question, context, mode, reviewStrategy, model, files) => {
        setEditRequest(null);
        handleSend(question, context, mode, reviewStrategy, model || selectedModel, files);
      }, [handleSend, selectedModel]);

      const resendTurn = useCallback((turn, turnIndex) => {
        if (running || !turn.question?.trim()) return;
        handleSend(
          turn.question.trim(),
          (turn.context || '').trim(),
          turn.mode || 'deep',
          turn.reviewStrategy || 'off',
          turn.model || selectedModel,
          turn.files || [],
          turnIndex,
          turn.sessionId || '',
        );
      }, [handleSend, running, selectedModel]);

      const copyTurn = useCallback(async (turn, key) => {
        const text = String(turn.question || '');
        if (!text) return;
        try {
          if (navigator.clipboard?.writeText) {
            await navigator.clipboard.writeText(text);
          } else {
            throw new Error('clipboard API unavailable');
          }
        } catch {
          try {
            const area = document.createElement('textarea');
            area.value = text;
            area.style.position = 'fixed';
            area.style.opacity = '0';
            document.body.appendChild(area);
            area.select();
            const copied = document.execCommand('copy');
            area.remove();
            if (!copied) throw new Error('copy failed');
          } catch (error) {
            console.error('[copy] failed:', error);
            return;
          }
        }
        setCopiedTurnKey(key);
        if (copyResetRef.current) clearTimeout(copyResetRef.current);
        copyResetRef.current = setTimeout(() => setCopiedTurnKey(''), 1600);
      }, []);

      const handleNewSession = useCallback(() => {
        setProjectDialog({
          initialProjectId: activeConversation ? (activeConversation.project_id || '') : (activeProjectId === null ? '' : activeProjectId),
        });
      }, [activeConversation, activeProjectId]);

      const handleProjectDialogConfirm = useCallback(async ({ projectId, newProject }) => {
        try {
          let targetProjectId = projectId || '';
          if (newProject) {
            const response = await fetch('/api/v1/projects', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ name: newProject.name, folder_path: newProject.folderPath || '' }),
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.detail || '创建项目失败');
            targetProjectId = data.project_id || '';
          }

          await refreshProjects();
          setActiveProjectId(targetProjectId);
          try { store.save({ activeProjectId: targetProjectId }); } catch {}
          await refresh();

          const newId = await create('新对话', targetProjectId);
          const optimisticEntry = {
            id: newId,
            name: '新对话',
            question_count: 0,
            last_active: new Date().toISOString(),
            project_id: targetProjectId,
          };
          setListDirect(prev => [optimisticEntry, ...prev]);
          setActiveConvId(newId);
          setTurns([]);
          setProjectDialog(null);
        } catch (e) {
          console.error('[project-dialog] error:', e);
          alert(e.message || '项目操作失败');
        }
      }, [create, refresh, refreshProjects, setListDirect, store]);

      const handleDeleteSession = useCallback(async (id) => {
        stop(id);  // stop background SSE if this conv is running
        await remove(id);
        if (id === activeConvId) { setActiveConvId(list.length > 1 ? list.find(c => c.id !== id)?.id || '' : ''); setTurns([]); }
      }, [remove, activeConvId, list, stop]);

      const handlePinSession = useCallback(async (id, pinned) => {
        try {
          await pin(id, pinned);
        } catch (e) {
          console.error('[pin] error:', e);
          alert(e.message || '置顶状态更新失败');
        }
      }, [pin]);

      const handleSelectSession = useCallback((id) => {
        if (id === activeConvId) return;
        // Don't stop background SSE — just switch the view
        setActiveConvId(id);
      }, [activeConvId]);

      return (
        <div className="praxic-shell flex h-screen overflow-hidden" onDragOver={handleDragOver} onDragEnter={handleDragEnter} onDragLeave={handleDragLeave} onDrop={handleDrop}>
          <Sidebar conversations={sortedConversations} activeId={activeConvId} onSelect={handleSelectSession} onDelete={handleDeleteSession} onPin={handlePinSession} onNewSession={handleNewSession}
                   animTitleId={animTitleId} runningConvs={runningConvs} onSettings={() => setShowSettings(true)}
                   sessionSort={sessionSort} onSortChange={setSessionSort} />
          <div className="w-px bg-clay/30 flex-shrink-0" />
          <div className="flex-1 flex flex-col min-w-0">
            {/* Chat header */}
            <div className="praxic-toolbar px-4 py-2 border-b border-linen/60 bg-cream flex items-center justify-end">
              <div className="flex items-center gap-2">
                {devMode && <span className="text-[10px] px-2 py-0.5 rounded bg-seal-wash text-seal">DEV</span>}
              </div>
            </div>

            {/* Chat flow */}
            <div ref={chatRef} className="praxic-flow flex-1 overflow-y-auto scrollbar-thin">
              {turns.length === 0 && !running && (
                <div className="flex items-center justify-center h-full">
                  {activeConvId && list.some(c => c.id === activeConvId && (c.name === '(加载中…)' || c.name === '(恢复中…)')) ? (
                    <div className="praxic-welcome text-center space-y-4 max-w-md mx-auto p-8">
                      <div className="text-5xl animate-pulse">🔄</div>
                      <h2 className="text-lg font-semibold text-ink font-display">正在恢复会话…</h2>
                      <p className="text-sm text-warmgray">后端可能仍在启动或处理中，请稍候。<br/>如果长时间无响应，可从左上角＋重新开始。</p>
                    </div>
                  ) : (
                  <div className="text-center space-y-4 max-w-md mx-auto p-8">
                    <BrandMark size={72} className="mx-auto" variant="red" />
                    <h2 className="text-xl font-bold text-ink font-display">Praxic Agent</h2>
                   <p className="text-sm text-warmgray">提出一个问题，开始认知循环</p>
                    {activeConvId && <p className="text-xs text-amber-600 mt-2">会话加载异常，可从左上角＋重新开始</p>}
                  </div>
                  )}
                </div>
              )}
              <div className="max-w-3xl mx-auto py-4 space-y-6 px-6">
                {turns.map((turn, i) => (
                  <div key={i} className="space-y-4 fade-in">
                    {/* Recovering notice after page refresh */}
                    {turn.type === 'recovering' && (
                      <div className="flex justify-center py-4">
                        <div className="flex items-center gap-2 px-4 py-2 rounded-full bg-amber-50 border border-amber-200 text-amber-700 text-xs">
                          <span className="w-3 h-3 rounded-full bg-amber-400 animate-pulse" />
                          服务器正在处理中… 页面已刷新，等待后台完成即自动加载结果。
                        </div>
                      </div>
                    )}
                    {/* User bubble */}
                    {turn.type !== 'recovering' && (
                    <div className="flex justify-end">
                      <div className="praxic-user-message group">
                        <div className={'praxic-user-bubble max-w-full rounded-2xl rounded-tr-md px-5 py-3 ' + (turn.steer ? 'bg-cream border border-clay/20 text-ink' : 'bg-seal text-white')}>
                          {editRequest?.turnIndex === i ? (
                            <InlineUserEditor key={editRequest.key} turn={turn} onCancel={() => setEditRequest(null)} onSend={sendEditedTurn} />
                          ) : (
                            <>
                              {turn.steer && <div className="text-[10px] text-olive font-semibold uppercase tracking-wide mb-0.5">引导</div>}
                              <div className="text-sm font-medium">{turn.question}</div>
                              {turn.files && turn.files.length > 0 && (
                                <div className="flex flex-wrap gap-1 mt-2">
                                  {turn.files.map((f, i) => (
                                    <span key={i} className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-white/20 text-[10px] text-white/80">
                                      📎 {f.name}
                                    </span>
                                  ))}
                                </div>
                              )}
                              {turn.context && (
                                <div className="praxic-user-context">
                                  <span className="praxic-user-context__label">背景</span>{turn.context}
                                </div>
                              )}
                            </>
                          )}
                        </div>
                        {!turn.steer && editRequest?.turnIndex !== i && (
                          <UserMessageActions
                            turn={turn}
                            onEdit={message => requestEdit(message, i)}
                            onResend={message => resendTurn(message, i)}
                            onCopy={message => copyTurn(message, 'turn-' + i)}
                            copied={copiedTurnKey === 'turn-' + i}
                            busy={running}
                          />
                        )}
                      </div>
                    </div>
                    )}

                    {/* Phase block: live for running last turn, or stored for completed turns (if setting allows) */}
                    {i === turns.length - 1 && turn.running && phaseLogs.length > 0 && (
                      <PhaseBlock phases={phaseLogs} activePhase={activePhase} completedPhases={completedPhases} running={true} onSteer={handleSteer} steeringCount={steeringCount} />
                    )}
                    {/* Agent bubble */}
                    {!turn.running && turn.summary && (
                      <div className="flex justify-start">
                        <div className="praxic-agent-bubble max-w-[80%] bg-cream border border-linen/50 rounded-2xl rounded-tl-md px-5 py-3">
                          {turn.phaseLogs && turn.phaseLogs.length > 0 && uiSettings.show_thinking_after_answer !== false ? (
                            <button type="button" className="praxic-agent-heading" onClick={() => setHistoryProcessOpen(prev => ({ ...prev, [i]: !prev[i] }))}
                              aria-expanded={!!historyProcessOpen[i]} aria-controls={'history-process-' + i} title={historyProcessOpen[i] ? '收起历史思维过程' : '展开历史思维过程'}>
                              <span className="flex items-center gap-1.5"><BrandMark size={16} />Praxic分析</span>
                              <span className="praxic-agent-heading__chevron" aria-hidden="true">{historyProcessOpen[i] ? '−' : '+'}</span>
                            </button>
                          ) : (
                            <div className="praxic-agent-heading"><span className="flex items-center gap-1.5"><BrandMark size={16} />Praxic分析</span></div>
                           )}
                           {historyProcessOpen[i] && turn.phaseLogs && turn.phaseLogs.length > 0 && (
                             <div id={'history-process-' + i} className="praxic-agent-process">
                               <PhaseBlock phases={turn.phaseLogs} activePhase={null} completedPhases={new Set(turn.phaseLogs.map(p => p.phase))} />
                             </div>
                           )}
                           <div className={'praxic-agent-answer' + (historyProcessOpen[i] && turn.phaseLogs && turn.phaseLogs.length > 0 ? ' praxic-agent-answer--separated' : '')}>
                             <div className="text-sm text-ink leading-relaxed markdown-body"
                               dangerouslySetInnerHTML={{__html: renderMarkdown(turn.summary)}} />
                          {turn.actions && turn.actions.length > 0 && (
                            <div className="mt-3 pt-3 border-t border-linen/40">
                              <div className="text-xs font-semibold text-olive mb-1.5">✅ 行动建议</div>
                              {turn.actions.map((a,j) => (
                                <div key={j} className="flex items-start gap-2 text-xs text-warmgray mb-1">
                                  <span className="w-4 h-4 rounded-full bg-olive text-white text-[9px] flex items-center justify-center flex-shrink-0 mt-0.5">{j+1}</span>
                                  <span>{a}</span>
                                </div>
                              ))}
                            </div>
                          )}
                          {turn.generatedFiles && turn.generatedFiles.length > 0 && (
                            <div className="mt-3 pt-3 border-t border-linen/40">
                              <div className="text-xs font-semibold text-seal mb-1.5">📎 生成文件</div>
                              <div className="space-y-1">
                                {turn.generatedFiles.map((f, j) => {
                                  const isImg = /\.(png|jpg|jpeg|gif|svg|webp|bmp)$/i.test(f.path);
                                  const url = '/api/v1/workspace/files/' + encodeURI(f.path);
                                  return (
                                    <div key={j}>
                                      {isImg ? (
                                        <div className="mt-2">
                                          <img src={url} alt={f.description || f.path} className="max-w-full rounded-lg border border-linen/50" loading="lazy" />
                                          <div className="text-[10px] text-warmgray mt-0.5 truncate">{f.path}</div>
                                        </div>
                                      ) : (
                                        <a href={url} target="_blank" className="flex items-center gap-2 text-xs text-seal hover:text-seal-light hover:underline p-1.5 rounded hover:bg-dust/40 transition-colors">
                                          <span className="text-[10px]">📄</span>
                                          <span className="truncate flex-1">{f.path}</span>
                                          {f.size_bytes > 0 && <span className="text-[10px] text-clay flex-shrink-0">{(f.size_bytes / 1024).toFixed(1)}KB</span>}
                                        </a>
                                      )}
                                    </div>
                                  );
                                })}
                              </div>
                            </div>
                          )}
                           </div>
                         </div>
                      </div>
                    )}

                  </div>
                ))}
              </div>
            </div>

            {activeAuthorization && (
              <AuthorizationPanel request={activeAuthorization} busy={authorizationBusy} error={authorizationError} onResolve={resolveAuthorization} />
            )}
            {clarify && clarify.convId === activeConvId && clarify.questions && clarify.questions.length > 0 && (
              <div className="px-4 pt-3 bg-cream">
                <div className="max-w-3xl mx-auto bg-seal-wash border border-seal/30 rounded-2xl px-4 py-3">
                  <div className="flex items-center gap-2 mb-1.5">
                    <span className="text-sm">🤔</span>
                    <span className="text-xs font-semibold text-seal">Praxic想先跟你确认几点再继续</span>
                  </div>
                  <ol className="space-y-1 mb-1.5 list-none">
                    {clarify.questions.map((q, i) => (
                      <li key={i} className="text-sm text-ink flex gap-2"><span className="text-seal font-semibold flex-shrink-0">{i + 1}.</span><span>{q}</span></li>
                    ))}
                  </ol>
                  <div className="text-[11px] text-warmgray">在下方输入回答后发送即可；留空发送＝跳过，Praxic将按现有信息继续。</div>
                </div>
              </div>
            )}
            <InputBar onSend={handleSend} running={running} onStop={stopCurrent} onSteer={handleSteer} model={selectedModel} availableModels={availableModels} onModelChange={v => { setSelectedModel(v); try { localStorage.setItem('praxic_selected_model', v); } catch {} }} files={files} setFiles={setFiles} uploading={uploading} handleFiles={handleFiles} awaitingClarification={!!(clarify && clarify.convId === activeConvId)} onAnswer={submitAnswer} />
          </div>
          {showSettings && <SettingsDialog uiSettings={uiSettings} availableModels={availableModels} devMode={devMode} setDevMode={setDevMode} onSave={(s) => {
            setUiSettings(s);
            try { localStorage.setItem('praxic_ui_settings', JSON.stringify(s)); } catch {}
            const fa = FONT_FAMILIES.find(x => x.id === s.font_family);
            const fs = FONT_SIZES.find(x => x.id === s.font_size);
            document.documentElement.style.setProperty('--app-font', (fa || FONT_FAMILIES[0]).css);
            document.documentElement.style.setProperty('--app-font-size', (fs || FONT_SIZES[1]).css);
            if (s.page_zoom) document.body.style.zoom = (s.page_zoom / 100).toString();
          }} onClose={() => setShowSettings(false)} />}
          {projectDialog && <ProjectDialog
            projects={projects}
            initialProjectId={projectDialog.initialProjectId || ''}
            onConfirm={handleProjectDialogConfirm}
            onCancel={() => setProjectDialog(null)}
          />}
          {dragOver && (
            <div className="fixed inset-0 z-50 bg-ink/25 backdrop-blur-sm flex items-center justify-center pointer-events-none">
              <div className="bg-cream border-2 border-dashed border-seal rounded-3xl px-10 py-8 shadow-xl">
                <div className="text-center space-y-2">
                  <div className="text-4xl">📎</div>
                  <div className="text-sm font-semibold text-ink font-display">松开以上传文件</div>
                  <div className="text-xs text-warmgray">文件将作为本轮提问的资料</div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ── RouteGuard ───────────────────────────────────────────
    function RouteGuard() {
      const [checking, setChecking] = useState(true);
      const [configured, setConfigured] = useState(false);
      useEffect(() => { (async () => {
        try { const r = await fetch('/api/v1/setup/status'); const d = await r.json(); setConfigured(d.configured);
          try { localStorage.setItem('praxic_dev_mode', JSON.stringify(!!d.dev_enabled)); } catch {}
        }
        catch { setConfigured(false); } finally { setChecking(false); }
      })(); }, []);
      if (checking) return <div className="min-h-screen bg-paper flex items-center justify-center"><div className="text-warmgray text-sm">正在检查配置…</div></div>;
      if (!configured) return <SetupScreen onConfigured={() => setConfigured(true)} />;
      return <App />;
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<RouteGuard />);
  </script>
</body>
</html>
