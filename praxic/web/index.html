<!DOCTYPE html>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>

  <style>

    html, body { font-family: var(--app-font); font-size: var(--app-font-size); }
    .markdown-body pre { background: rgba(0,0,0,0.04); border-radius: 6px; padding: 10px 14px; overflow-x: auto; font-size: 0.8em; }
    .markdown-body img { max-width: 100%; height: auto; }
    .markdown-body blockquote { border-left: 3px solid #ccc; padding-left: 12px; color: #666; margin: 8px 0; }
    .markdown-body table { border-collapse: collapse; width: 100%; font-size: 0.85em; }
    .markdown-body th, .markdown-body td { border: 1px solid #ddd; padding: 6px 10px; text-align: left; }
    .markdown-body th { background: rgba(0,0,0,0.03); font-weight: 600; }
    @keyframes titlePopIn { 0% { opacity: 0.3; transform: translateY(4px); } 60% { opacity: 1; transform: translateY(-1px); } 100% { opacity: 1; transform: translateY(0); } }

    .praxic-brand-mark { display: inline-block; flex: 0 0 auto; object-fit: contain; }

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            paper: '#F7F4ED', cream: '#FCFAF5', linen: '#EDE8DF',
            ink: '#1C1916', warmgray: '#6B6560',
            seal: { DEFAULT: '#8C0000', light: '#B85450', wash: '#FFF5F3' },
            gold: '#9E7B3A', olive: '#4A6741', olivewash: '#F0F5EE',
            clay: '#C5BFB5', dust: '#EFEBE4',
          },
          fontFamily: {
            display: ['"Noto Serif SC"', 'serif'],
            body: ['"Microsoft YaHei"', '"Segoe UI"', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Microsoft YaHei', 'Segoe UI', sans-serif; background: #F7F4ED; color: #1C1916; }
    .scrollbar-thin::-webkit-scrollbar { width: 6px; }
    .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: #C5BFB5; border-radius: 3px; }
    .fade-in { animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes buildSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .build-spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(140,0,0,0.2); border-top-color: #8C0000; border-radius: 50%; animation: buildSpin 0.7s linear infinite; vertical-align: middle; margin-right: 4px; }
  </style>

  <style id="praxic-constructivist">
    :root {
      --construct-paper: #f7f4ed;
      --construct-surface: #fcfaf5;
      --construct-ink: #1C1916;
      --construct-muted: #6b6560;
      --construct-line: #c5bfb5;
      --construct-red: #8C0000;
      --construct-blue: #4a6741;
      --construct-yellow: #9e7b3a;
    }
    html, body {
      background: var(--construct-paper) !important;
      color: var(--construct-ink) !important;
      letter-spacing: 0;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0 0 auto 0;
      z-index: 80;
      height: 4px;
      background: var(--construct-red);
      pointer-events: none;
    }
    button, input, textarea, select {
      letter-spacing: 0;
    }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
      outline: 2px solid var(--construct-blue) !important;
      outline-offset: 2px;
    }
    .praxic-shell {
      padding-top: 4px;
      background: var(--construct-paper);
    }
    .praxic-sidebar {
      width: 17rem !important;
      background: #ede8df !important;
      border-right: 2px solid var(--construct-ink) !important;
    }
    .praxic-sidebar > div:first-child {
      min-height: 60px;
      color: #f8f8f4;
      background: var(--construct-ink);
      border-bottom: 4px solid var(--construct-red) !important;
    }
    .praxic-sidebar > div:first-child > span {
      color: #f8f8f4 !important;
      font-family: Arial, "Microsoft YaHei", sans-serif !important;
      font-size: 14px !important;
      font-weight: 900 !important;
      text-transform: uppercase;
    }
    .praxic-sidebar > div:first-child button {
      border: 1px solid var(--construct-yellow);
      border-radius: 2px !important;
      color: var(--construct-ink);
      background: var(--construct-yellow) !important;
      box-shadow: 3px 3px 0 var(--construct-red);
    }
    .praxic-sidebar button {
      border-radius: 2px !important;
    }
    .praxic-sidebar select {
      border-radius: 0 !important;
    }
    .praxic-toolbar {
      min-height: 52px;
      background: var(--construct-ink) !important;
      border-bottom: 4px solid var(--construct-red) !important;
    }
    .praxic-toolbar button {
      min-width: 68px;
      border: 1px solid var(--construct-yellow);
      border-radius: 2px !important;
      color: var(--construct-ink) !important;
      background: var(--construct-yellow) !important;
      font-weight: 800;
    }
    .praxic-flow {
      background: #f7f4ed !important;
    }
    .praxic-flow .max-w-3xl {
      max-width: 58rem !important;
    }
    .praxic-phase-block {
      border: 1px solid var(--construct-line) !important;
      border-left: 5px solid var(--construct-blue) !important;
      border-radius: 2px !important;
      background: var(--construct-surface) !important;
      box-shadow: none !important;
    }
    .praxic-inputbar {
      border-top: 2px solid var(--construct-ink) !important;
      background: #efebe4 !important;
    }
    .praxic-inputbar textarea {
      min-height: 44px;
      border: 1px solid var(--construct-line) !important;
      border-radius: 2px !important;
      background: var(--construct-surface) !important;
    }
    .praxic-inputbar button, .praxic-inputbar input, .praxic-inputbar select {
      border-radius: 5px !important;
    }
    .praxic-inputbar > div:last-child button,
    .praxic-inputbar > div:last-child select {
      min-height: 30px;
      font-size: 12px !important;
    }
    .praxic-inputbar button.bg-seal {
      box-shadow: 3px 3px 0 var(--construct-blue);
    }
    .praxic-flow .rounded-2xl,
    .praxic-flow .rounded-xl,
    .praxic-flow .rounded-lg,
    .praxic-flow .rounded-md {
      border-radius: 3px !important;
    }
    .praxic-flow .shadow-xl,
    .praxic-flow .shadow-lg,
    .praxic-flow .shadow-md {
      box-shadow: none !important;
    }
    .praxic-flow img {
      border-radius: 2px !important;
    }
    [role="dialog"] {
      border-radius: 3px !important;
    }
    @keyframes construct-enter {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-in {
      animation: construct-enter 180ms ease-out;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
    @media (max-width: 760px) {
      .praxic-shell {
        height: 100dvh !important;
        flex-direction: column;
      }
      .praxic-sidebar {
        width: 100% !important;
        height: 34dvh;
        min-height: 210px;
        border-right: 0 !important;
        border-bottom: 2px solid var(--construct-ink) !important;
      }
      .praxic-shell > .w-px {
        display: none;
      }
      .praxic-toolbar {
        min-height: 44px;
      }
      .praxic-flow .max-w-3xl {
        padding-left: 14px !important;
        padding-right: 14px !important;
      }
      .praxic-flow .max-w-\[75\%\],
      .praxic-flow .max-w-\[80\%\] {
        max-width: 94% !important;
      }
      .praxic-phase-block {
        margin-left: 14px !important;
        margin-right: 14px !important;
      }
      .praxic-inputbar {
        padding: 10px !important;
      }
      .praxic-inputbar > div {
        flex-wrap: wrap;
      }
      .praxic-inputbar textarea {
        min-width: 0;
      }
    }
  </style>

  <style id="praxic-poster-type">

<body class="bg-paper text-ink antialiased">
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel" data-type="module">
    const { useState, useCallback, useEffect, useRef, useMemo } = React;
    const LS_KEY = 'praxic_app_state';
    const BRAND_MARK_URLS = {
      dark: '/assets/brand/praxic-mark-v2.svg',
      red: '/assets/brand/praxic-mark-red-outline-v2.svg',
    };

    function BrandMark({ size = 20, className = '', variant = 'dark' }) {
      return (
        <img
          src={BRAND_MARK_URLS[variant] || BRAND_MARK_URLS.dark}
          alt=""
          aria-hidden="true"
          draggable="false"
          className={'praxic-brand-mark ' + className}
          style={{ width: size, height: size }}
        />
      );
    }

    // ── Constants ────────────────────────────────────────────
    const PHASES = [
      { id: 'file_load',      icon: '📎', label: '文件加载', subtitle: '准备资料' },
      { id: 'preprocessing',  icon: '🔎', label: '问题解析', subtitle: '揣度意图' },
      { id: 'investigation', icon: '🔍', label: '调查研究', subtitle: '实事求是' },
      { id: 'contradiction',  icon: '⚡', label: '矛盾分析', subtitle: '抓主要矛盾' },
      { id: 'rational',       icon: '🧠', label: '理性认识', subtitle: '去伪存真' },
      { id: 'practice',       icon: '⚙️', label: '实践检验', subtitle: '行动与验证' },
      { id: 'reflection',     icon: '🔄', label: '反思', subtitle: '验证与修正' },
    ];
    const PHASE_LABELS = Object.fromEntries(PHASES.map(p => [p.id, p.label]));
    const PHASE_ICONS = Object.fromEntries(PHASES.map(p => [p.id, p.icon]));
    PHASE_LABELS.authorization = '行动授权';
    PHASE_ICONS.authorization = '!';

    // ── Markdown renderer ──────────────────────────────────────
    // 简易 markdown → HTML，支持公式（MathJax）、图片、链接、代码、列表、粗体
    const IMG_EXT = /\.(png|jpg|jpeg|gif|svg|webp|bmp)$/i;
    function imageUrl(path) {
      if (/^https?:\/\//i.test(path)) return path;
      return '/api/v1/workspace/files/' + encodeURI(path);
    }
    function renderMarkdown(text) {
      if (!text) return '';
      text = cleanPromptLeakage(text);
      // escape HTML first, then apply markdown rules
      let html = text
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      // code blocks (before other rules to avoid conflicts)
      html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) =>
        '<pre class="bg-dust/60 rounded p-3 my-2 overflow-x-auto text-xs"><code>' + code.trim() + '</code></pre>');
      // inline code
      html = html.replace(/`([^`]+)`/g, '<code class="bg-dust/60 px-1 rounded text-xs">$1</code>');
      // images ![alt](path)
      html = html.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (_, alt, path) =>
        '<img src="' + imageUrl(path.trim()) + '" alt="' + alt + '" class="max-w-full rounded-lg my-2 border border-linen/50" loading="lazy" />');
      // links [text](url)
      html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, txt, url) =>
        '<a href="' + url.trim() + '" target="_blank" class="text-seal underline hover:text-seal-light">' + txt + '</a>');
      // bold **text**
      html = html.replace(/\*\*([^*]+)\*\*/g, '<strong class="font-semibold">$1</strong>');
      // headings
      html = html.replace(/^### (.+)$/gm, '<h4 class="font-semibold text-ink mt-3 mb-1">$1</h4>');
      html = html.replace(/^## (.+)$/gm, '<h3 class="font-semibold text-ink mt-3 mb-1">$1</h3>');
      html = html.replace(/^# (.+)$/gm, '<h2 class="font-semibold text-ink mt-3 mb-1">$1</h2>');
      // unordered lists
      html = html.replace(/^- (.+)$/gm, '<li class="ml-4 list-disc">$1</li>');
      // numbered lists
      html = html.replace(/^\d+\. (.+)$/gm, '<li class="ml-4 list-decimal">$1</li>');
      // paragraphs: double newline → </p><p>
      html = '<p class="mb-2">' + html.replace(/\n\n+/g, '</p><p class="mb-2">') + '</p>';
      // single newline → <br>
      html = html.replace(/\n/g, '<br>');
      // clean empty paragraphs
      html = html.replace(/<p class="mb-2"><\/p>/g, '');
      return html;
    }

    // ── Prompt-leakage cleaner ─────────────────────────────────
    // Strips common LLM instruction-regurgitation patterns from output.
    function cleanPromptLeakage(text) {
      if (!text) return '';
      let t = text;
      // Strip lines that are pure instruction regurgitation
      const leakagePatterns = [
        /^根据[（(]?给定的?材料[)）]?[，,]?\s*/gm,
        /^根据要求[，,]?\s*/gm,
        /^我们被要求[^。\n]*[。\n]?/gm,
        /^按照(提示|指令|指示|要求)[^。\n]*[。\n]?/gm,
        /^依据(指示|指令|要求)[^。\n]*[。\n]?/gm,
        /^(你的任务是|核心原则是?)[^。\n]*[。\n]?/gm,
        /^要点如下[：:]?\s*/gm,
        /^根据上述(分析|材料|信息|指令)[，,]?\s*/gm,
        /^我(注意到|观察到|发现)(以下)?(几个)?要点[：:]?\s*/gm,
        /^关键发现[：:]\s*/gm,
        /^在(回答|分析|讨论)之前[，,]?[^。\n]*[。\n]?/gm,
      ];
      for (const pat of leakagePatterns) {
        t = t.replace(pat, '');
      }
      // Remove empty leading lines after stripping
      t = t.replace(/^[\s\n]+/, '');
      return t;
    }

    function conversationLabel(conversation) {
      const name = String(conversation?.name || '').trim();
      const looksLikeTitlePlaceholder = /^<\s*\d+\s*-\s*\d+\s+chines?/i.test(name)
        || /\bchinese\s+characters?\b/i.test(name);
      if (name && !looksLikeTitlePlaceholder) return name;
      const fallback = String(conversation?.last_question || '').trim().replace(/\s+/g, ' ');
      return fallback ? fallback.slice(0, 24) : '新对话';
    }

    function relativeConversationTime(value, now = Date.now()) {
      const timestamp = Date.parse(String(value || ''));
      if (!Number.isFinite(timestamp)) return '';
      const elapsed = Math.max(0, now - timestamp);
      const minute = 60 * 1000;
      const hour = 60 * minute;
      const day = 24 * hour;
      const week = 7 * day;
      const month = 30 * day;
      const year = 365 * day;
      if (elapsed < minute) return 'now';
      if (elapsed < hour) return `${Math.floor(elapsed / minute)}m ago`;
      if (elapsed < day) return `${Math.floor(elapsed / hour)}h ago`;
      if (elapsed < week) return `${Math.floor(elapsed / day)}d ago`;
      if (elapsed < month) return `${Math.floor(elapsed / week)}w ago`;
      if (elapsed < year) return `${Math.floor(elapsed / month)}mon ago`;
      return `${Math.floor(elapsed / year)}y ago`;
    }

    function historyTurnFromApi(turn) {
      const interrupted = turn?.summary === '[...]';
      const phaseLogs = turn?.phase_logs || turn?.phaseLogs || [];
      return {
        type: 'history',
        sessionId: turn?.session_id || turn?.sessionId || '',
        question: turn?.question || '',
        context: turn?.context || '',
        summary: interrupted
          ? '**认知循环已中断**\n\n这轮运行没有形成最终答复，已发生的过程仍保留在下方。'
          : (turn?.summary || ''),
        actions: turn?.action_items || turn?.actions || [],
        generatedFiles: turn?.generated_files || turn?.generatedFiles || [],
        phaseLogs,
        createdAt: turn?.created_at || turn?.createdAt || '',
      };
    }

    // ── useLocalStore ────────────────────────────────────────
    function useLocalStore() {
      const load = useCallback(() => {
        try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch { return {}; }
      }, []);
      const save = useCallback((patch) => {
        const prev = load();
        const next = { ...prev, ...patch };
        localStorage.setItem(LS_KEY, JSON.stringify(next));
      }, [load]);
      return useMemo(() => ({ load, save }), [load, save]);
    }

    // ── useConversations ─────────────────────────────────────
    function useConversations() {
      const [list, setList] = useState([]);
      const [loading, setLoading] = useState(false);
      const store = useLocalStore();
      const refresh = useCallback(async ({ _retry = 0, _maxRetries = 3 } = {}) => {
        setLoading(true);
        try {
          const r = await fetch('/api/v1/conversations');
          if (!r.ok && _retry < _maxRetries) {
            console.log('[refresh] HTTP', r.status, 'retrying', _retry + 1, '/', _maxRetries);
            setLoading(false);
            await new Promise(res => setTimeout(res, 1000 * (_retry + 1)));
            return refresh({ _retry: _retry + 1, _maxRetries });
          }
          const data = await r.json();
          const convs = data.conversations || [];
          console.log('[refresh] got', convs.length, 'conversations:', convs.map(c => c.id));
          setList(convs);
          store.save({ conversations: convs.map(c => ({ id: c.id, name: c.name, last_question: c.last_question || '', question_count: c.question_count, last_active: c.last_active, project_id: c.project_id || '', pinned: !!c.pinned })) });
        } catch (e) {
          console.error('[refresh] error:', e);
          if (_retry < _maxRetries) {
            console.log('[refresh] retrying', _retry + 1, '/', _maxRetries);
            setLoading(false);
            await new Promise(res => setTimeout(res, 1000 * (_retry + 1)));
            return refresh({ _retry: _retry + 1, _maxRetries });
          }
          // 最后一次重试也失败了——不清空列表，用 localStorage 缓存兜底
          const cached = store.load();
          const cachedConvs = cached?.conversations || [];
          if (cachedConvs.length) {
            console.log('[refresh] using cached conversations from localStorage:', cachedConvs.length);
            setList(cachedConvs);
          }
          // 即使是空列表也不 setList([])——保留任何已有数据
        }
        finally { setLoading(false); }
      }, [store]);

      const create = useCallback(async (name, projectId = '') => {
        console.log('[create] POST with name:', name, 'project:', projectId);
        const r = await fetch('/api/v1/conversations', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: name || '新对话', project_id: projectId || '' }) });
        const data = await r.json();
        console.log('[create] got conversation_id:', data.conversation_id);
        // NOTE: caller is responsible for updating the list — do NOT call refresh() here
        // because it races with the caller's optimistic insert.
        return data.conversation_id;
      }, []);  // no deps — only POST endpoint, no refresh dependency

      const rename = useCallback(async (id, name) => {
        await fetch('/api/v1/conversations/' + id, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name }) });
        await refresh();
      }, [refresh]);

      const remove = useCallback(async (id) => {
        await fetch('/api/v1/conversations/' + id, { method: 'DELETE' });
        await refresh();
      }, [refresh]);

      const pin = useCallback(async (id, pinned) => {
        const r = await fetch('/api/v1/conversations/' + id + '/pin', {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pinned: !!pinned }),
        });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(data.detail || '置顶状态更新失败');
        await refresh();
      }, [refresh]);

      const loadTurns = useCallback(async (id, { _retry = 0, _maxRetries = 3 } = {}) => {
        try {
          const r = await fetch('/api/v1/conversations/' + id);
          if (!r.ok && _retry < _maxRetries) {
            console.log('[loadTurns] HTTP', r.status, 'retrying', _retry + 1);
            await new Promise(res => setTimeout(res, 500 * (_retry + 1)));
            return loadTurns(id, { _retry: _retry + 1, _maxRetries });
          }
          const data = await r.json();
          return data.turns || [];
        } catch (e) {
          console.error('[loadTurns] error:', e);
          if (_retry < _maxRetries) {
            await new Promise(res => setTimeout(res, 500 * (_retry + 1)));
            return loadTurns(id, { _retry: _retry + 1, _maxRetries });
          }
          return [];
        }
      }, []);

      return { list, setList, loading, refresh, create, rename, remove, pin, loadTurns };
    }

    // ── useSSE ───────────────────────────────────────────────
    // Supports multiple concurrent SSE streams per conversation for background execution.
    function useSSE() {
      const [runningConvs, setRunningConvs] = useState(() => new Set());
      const esMapRef = useRef({});  // { convId: EventSource }
      const cbMapRef = useRef({});   // { convId: { onPhase, onDone, onTitle } }

      const stop = useCallback((convId) => {
        const es = esMapRef.current[convId];
        const cbs = cbMapRef.current[convId];
        if (es) { es.close(); delete esMapRef.current[convId]; }
        delete cbMapRef.current[convId];
        setRunningConvs(prev => { const next = new Set(prev); next.delete(convId); return next; });
        // 更新 UI：标记 turn 为已完成
        if (cbs?.onDone) {
          cbs.onDone({ done: true, summary: '**已终止**\n\n认知循环已由用户手动终止。', error: '' });
        }
      }, []);

      const start = useCallback((question, context, mode, conversationId, reviewStrategy, model, projectId, files, { onPhase, onDone, onTitle, onClarification, onAuthorization, replaceSessionId = '' }) => {
        // Don't re-start if already running for this conv
        if (esMapRef.current[conversationId]) return;
        cbMapRef.current[conversationId] = { onPhase, onDone, onTitle, onClarification, onAuthorization };
        const url = '/api/v1/agent/run/stream'
          + '?question=' + encodeURIComponent(question)
          + '&context=' + encodeURIComponent(context)
          + '&mode=' + encodeURIComponent(mode)
          + '&conversation_id=' + encodeURIComponent(conversationId)
          + '&review_strategy=' + encodeURIComponent(reviewStrategy || 'once')
          + '&model=' + encodeURIComponent(model || '')
          + '&project_id=' + encodeURIComponent(projectId || '')
          + '&files=' + encodeURIComponent((files && files.length) ? files.join(',') : '')
          + '&replace_session_id=' + encodeURIComponent(replaceSessionId || '')
          + '&dev_trace=1';
        const es = new EventSource(url);
        esMapRef.current[conversationId] = es;
        setRunningConvs(prev => new Set([...prev, conversationId]));
        es.onmessage = (e) => {
          try {
            const data = JSON.parse(e.data);
            const cbs = cbMapRef.current[conversationId];
            if (data.type === 'title') {
              console.log('[SSE] title event received:', data.title, 'for', data.conversation_id);
              cbs?.onTitle?.(data.title, data.conversation_id);
            } else if (data.type === 'clarification') {
              console.log('[SSE] clarification for', conversationId, ':', data.questions);
              cbs?.onClarification?.(data.questions || [], conversationId);
            } else if (data.event_type === 'authorization_requested' || data.event_type === 'authorization_resolved') {
              cbs?.onAuthorization?.(data.data?.authorization || data.data || null, data.event_type, conversationId);
              cbs?.onPhase?.(data.phase, data.summary || '', data.data || null);
            } else if (data.done) {
              console.log('[SSE] done event for', conversationId);
              es.close(); delete esMapRef.current[conversationId];
              setRunningConvs(prev => { const next = new Set(prev); next.delete(conversationId); return next; });
              cbs?.onDone?.(data);
            } else if (data.phase) {
              console.log('[SSE] phase for', conversationId, ':', data.phase);
              cbs?.onPhase?.(data.phase, data.summary || '', data.data || null);
            }
          } catch (e2) { console.error('[SSE] parse error:', e2); }
        };
        es.onerror = () => {
          es.close(); delete esMapRef.current[conversationId];
          setRunningConvs(prev => { const next = new Set(prev); next.delete(conversationId); return next; });
          const cbs = cbMapRef.current[conversationId];
          cbs?.onDone?.({ error: '连接中断' });
          delete cbMapRef.current[conversationId];
        };
      }, []);

      const attach = useCallback((convId, { onPhase, onDone, onClarification, onAuthorization }) => {
        if (esMapRef.current[convId]) return;
        cbMapRef.current[convId] = { onPhase, onDone, onClarification, onAuthorization };
        const url = '/api/v1/agent/run/stream?conversation_id=' + encodeURIComponent(convId);
        const es = new EventSource(url);
        esMapRef.current[convId] = es;
        setRunningConvs(prev => new Set([...prev, convId]));
        es.onmessage = (e) => {
          try {
            const data = JSON.parse(e.data);
            const cbs = cbMapRef.current[convId];
            if (data.type === 'clarification') {
              cbs?.onClarification?.(data.questions || [], convId);
            } else if (data.event_type === 'authorization_requested' || data.event_type === 'authorization_resolved') {
              cbs?.onAuthorization?.(data.data?.authorization || data.data || null, data.event_type, convId);
              cbs?.onPhase?.(data.phase, data.summary || '', data.data || null);
            } else if (data.done) {
              es.close(); delete esMapRef.current[convId];
              setRunningConvs(prev => { const next = new Set(prev); next.delete(convId); return next; });
              cbs?.onDone?.(data);
            } else if (data.phase) {
              cbs?.onPhase?.(data.phase, data.summary || '', data.data || null);
            }
          } catch (e2) { console.error('[SSE attach] parse error:', e2); }
        };
        es.onerror = () => {
          es.close(); delete esMapRef.current[convId];
          setRunningConvs(prev => { const next = new Set(prev); next.delete(convId); return next; });
          const cbs = cbMapRef.current[convId];
          cbs?.onDone?.({ error: 'attach_failed' });
          delete cbMapRef.current[convId];
        };
      }, []);

      useEffect(() => {
        return () => {
          Object.values(esMapRef.current).forEach(es => es.close());
          esMapRef.current = {};
        };
      }, []);
      return { runningConvs, start, stop, attach };
    }

    // ── Project / conversation dialog ──────────────────────────
    function ProjectDialog({ projects, initialProjectId = '', onConfirm, onCancel }) {
      const [createNew, setCreateNew] = useState(false);
      const [selectedProjectId, setSelectedProjectId] = useState(initialProjectId || '');
      const [projectMode, setProjectMode] = useState('new');
      const [name, setName] = useState('');
      const [folderPath, setFolderPath] = useState('');

      const canConfirm = createNew
        ? name.trim() && (projectMode === 'new' || folderPath.trim())
        : true;

      const handlePickFolder = async () => {
        const pickFn = window.praxic?.pickFolder || window.praxic?.selectFolder;
        if (!pickFn) return;
        try {
          const picked = await pickFn();
          if (picked) {
            setFolderPath(picked);
            if (!name.trim()) setName(picked.split(/[\\/]/).pop() || '');
          }
        } catch (e) { console.error('[pickFolder] error:', e); }
      };

      const submit = () => {
        if (!canConfirm) return;
        onConfirm({
          projectId: selectedProjectId,
          newProject: createNew ? { name: name.trim(), folderPath: projectMode === 'link' ? folderPath.trim() : '' } : null,
        });
      };

      return (
        <div className="praxic-project-overlay fixed inset-0 z-50 flex items-center justify-center" onClick={onCancel}>
          <div className="praxic-project-dialog" onClick={e => e.stopPropagation()}>
            <div className="praxic-project-dialog__head">
              <div>
                <div className="praxic-project-dialog__eyebrow">PROJECT / SESSION</div>
                <h2>新建对话</h2>
              </div>
              <button type="button" onClick={onCancel} aria-label="关闭">×</button>
            </div>

            {!createNew && (
              <div className="praxic-project-dialog__field">
                <label htmlFor="conversation-project">所属项目</label>
                <select id="conversation-project" value={selectedProjectId} onChange={e => setSelectedProjectId(e.target.value)}>
                  {(projects || []).map(project => (
                    <option key={project.id || '__default__'} value={project.id}>{project.name}</option>
                  ))}
                </select>
              </div>
            )}

            <button type="button" className="praxic-project-dialog__switch" onClick={() => setCreateNew(true)}>
              + 新建项目并归入此对话
            </button>

            {createNew && (
              <>
                <div className="praxic-project-dialog__mode">
                  <button type="button" className={projectMode === 'new' ? 'is-active' : ''} onClick={() => setProjectMode('new')}>新建工作区</button>
                  <button type="button" className={projectMode === 'link' ? 'is-active' : ''} onClick={() => setProjectMode('link')}>关联已有文件夹</button>
                </div>
                <div className="praxic-project-dialog__field">
                  <label htmlFor="project-name">项目名称</label>
                  <input id="project-name" value={name} onChange={e => setName(e.target.value)} placeholder="例如：研究项目" autoFocus />
                </div>
                {projectMode === 'link' && (
                  <div className="praxic-project-dialog__field">
                    <label htmlFor="project-folder">文件夹路径</label>
                    <div className="praxic-project-dialog__path">
                      <input id="project-folder" value={folderPath} onChange={e => setFolderPath(e.target.value)} placeholder="C:\\Users\\...\\Project" />
                      {(window.praxic?.pickFolder || window.praxic?.selectFolder) && (
                        <button type="button" onClick={handlePickFolder}>选择</button>
                      )}
                    </div>
                  </div>
                )}
                <button type="button" className="praxic-project-dialog__switch" onClick={() => setCreateNew(false)}>
                  返回已有项目
                </button>
              </>
            )}

            <div className="praxic-project-dialog__actions">
              <button type="button" onClick={onCancel}>取消</button>
              <button type="button" className="is-primary" disabled={!canConfirm} onClick={submit}>
                {createNew ? '创建并开始' : '开始对话'}
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ── Sidebar（对话导航：会话是主入口，运行细节在中间展开）──────
    function Sidebar({ conversations, activeId, onSelect, onDelete, onPin, onNewSession,
                       animTitleId, runningConvs, onSettings, sessionSort, onSortChange }) {
      const [collapsed, setCollapsed] = useState(false);
      const [collapsedProjects, setCollapsedProjects] = useState({});
      const [query, setQuery] = useState('');
      const [relativeNow, setRelativeNow] = useState(() => Date.now());
      useEffect(() => {
        const timer = setInterval(() => setRelativeNow(Date.now()), 60 * 1000);
        return () => clearInterval(timer);
      }, []);
      const filteredConversations = useMemo(() => {
        const normalized = query.trim().toLowerCase();
        if (!normalized) return conversations || [];
        return (conversations || []).filter(c =>
          c.type !== 'group_header' && conversationLabel(c).toLowerCase().includes(normalized),
        );
      }, [conversations, query]);
      const pinnedConversations = filteredConversations.filter(c => c.type !== 'group_header' && c.pinned);
      const regularConversations = filteredConversations.filter(c => c.type === 'group_header' || !c.pinned);
      const regularCount = regularConversations.filter(c => c.type !== 'group_header').length;
      const activeConversation = (conversations || []).find(c => c.id === activeId);
      const showRelativeTime = sessionSort !== 'by_project';
      const visibleRegularConversations = useMemo(() => {
        let currentProjectId = null;
        return regularConversations.filter(c => {
          if (c.type === 'group_header') {
            currentProjectId = c.pid;
            return true;
          }
          return currentProjectId === null || !collapsedProjects[currentProjectId];
        });
      }, [regularConversations, collapsedProjects]);
      const toggleProject = pid => setCollapsedProjects(prev => ({ ...prev, [pid]: !prev[pid] }));

      const renderSession = c => {
        const age = showRelativeTime ? relativeConversationTime(c.last_active, relativeNow) : '';
        return (
          <div key={c.id} className={'praxic-session-item group ' + (c.id === activeId ? 'praxic-session-item--active' : '')}>
            <button type="button" className="praxic-session-item__select" onClick={() => onSelect(c.id)}>
              <span className="praxic-session-item__mark">{runningConvs && runningConvs.has(c.id) ? '●' : '•'}</span>
              <span className={'praxic-session-item__name ' + (c.id === animTitleId ? 'title-fade-in' : '')}>{conversationLabel(c)}</span>
              {age && <span className="praxic-session-item__age" title={c.last_active || ''}>{age}</span>}
              <span className="praxic-session-item__count">{c.question_count || 0}</span>
            </button>
            <button type="button" className={'praxic-session-item__pin ' + (c.pinned ? 'is-pinned' : '')}
              onClick={e => { e.stopPropagation(); onPin(c.id, !c.pinned); }}
              title={c.pinned ? '取消置顶' : '置顶对话'} aria-label={c.pinned ? '取消置顶对话' : '置顶对话'} aria-pressed={!!c.pinned}>
              {c.pinned ? '★' : '☆'}
            </button>
            <button type="button" className="praxic-session-item__delete"
              onClick={e => { e.stopPropagation(); onDelete(c.id); }} aria-label="删除对话" title="删除对话">×</button>
          </div>
        );
      };

      return (
        <aside className={'praxic-sidebar flex flex-col flex-shrink-0 ' + (collapsed ? 'praxic-sidebar--collapsed' : '')}>
          <div className="praxic-sidebar-head">
            <span className="praxic-sidebar-title"><BrandMark size={30} variant="red" /></span>
            <div className="praxic-sidebar-actions">
              <button onClick={onNewSession} title="新建对话" aria-label="新建对话">＋</button>
              <button onClick={onSettings} title="设置" aria-label="设置">⚙</button>
              <button onClick={() => setCollapsed(v => !v)} title={collapsed ? '展开侧栏' : '收起侧栏'} aria-label={collapsed ? '展开侧栏' : '收起侧栏'}>{collapsed ? '›' : '‹'}</button>
            </div>
          </div>

          {!collapsed && <div className="praxic-sidebar-body">
            <div className="praxic-sidebar-context">
              <button className="praxic-sidebar-context__item" onClick={() => activeId && onSelect(activeId)}>
                <span className="praxic-sidebar-context__icon">◌</span>
                <span className="truncate">{activeConversation ? conversationLabel(activeConversation) : 'Praxic Agent'}</span>
                <span className="praxic-sidebar-context__dot" />
              </button>
            </div>

            <label className="praxic-sidebar-search">
              <span>⌕</span>
              <input value={query} onChange={e => setQuery(e.target.value)} placeholder="搜索聊天记录" aria-label="搜索聊天记录" />
            </label>

            <div className="praxic-sidebar-list scrollbar-thin">
              <div className="praxic-sidebar-section-head praxic-sidebar-section-head--pinned">
                <div className="praxic-sidebar-section-label">置顶</div>
              </div>
              {pinnedConversations.map(renderSession)}
              <div className="praxic-sidebar-section-head">
                <div className="praxic-sidebar-section-label">对话</div>
                <select value={sessionSort} onChange={e => onSortChange(e.target.value)} aria-label="对话排序">
                  <option value="recent">最近优先</option>
                  <option value="oldest">最早优先</option>
                  <option value="by_project">按项目分组</option>
                </select>
              </div>
              {!regularCount && !pinnedConversations.length && <div className="praxic-sidebar-empty">暂无对话</div>}
              {visibleRegularConversations.map(c => (
                c.type === 'group_header' ? (
                  <button
                    key={'group-' + c.pid}
                    type="button"
                    className="praxic-sidebar-group"
                    onClick={() => toggleProject(c.pid)}
                    aria-expanded={!collapsedProjects[c.pid]}
                    title={collapsedProjects[c.pid] ? '展开项目对话' : '折叠项目对话'}
                  >
                    <svg className="praxic-sidebar-group__icon" viewBox="0 0 14 14" aria-hidden="true">
                      {collapsedProjects[c.pid] ? (
                        <path d="M1.5 4.5h4.1l1.3 1.2h5.6v6.2H1.5z" fill="none" />
                      ) : (
                        <path d="M1.5 5.2h4.1l1.2 1.1h5.7l-1.4 5.2H2.2z" fill="none" />
                      )}
                    </svg>
                    <span className="praxic-sidebar-group__label">{c.label}</span>
                  </button>
                ) : (
                  renderSession(c)
                )
              ))}
            </div>
          </div>}
        </aside>
      );
    }

    // ── Explicit phase/event stream ─────────────────────────
    function canonicalPhase(phase, currentPhase) {
      if (phase === 'action') return 'practice';
      if (phase === 'authorization') return currentPhase || 'practice';
      if (phase === 'done') return 'reflection';
      if (PHASE_LABELS[phase]) return phase;
      return phase || currentPhase || 'practice';
    }

    function eventKind(entry) {
      return String(entry?.data?.event_type || (entry?.phase === 'action' ? 'tool_call' : 'phase'));
    }

    function eventTool(entry) {
      return String(entry?.data?.tool || entry?.data?.record?.tool || entry?.data?.tool_name || 'TOOL');
    }

    function eventFailure(entry) {
      const result = entry?.data?.record?.result || {};
      return result.status === 'error'
        || result.state_classification === 'verification_failed'
        || result.state_classification === 'tool_error'
        || entry?.data?.status === 'denied'
        || entry?.data?.authorization?.status === 'denied'
        || eventKind(entry) === 'error';
    }

    function eventStatus(entry, context = {}) {
      const kind = eventKind(entry);
      const authStatus = entry?.data?.status || entry?.data?.authorization?.status;
      if (kind.startsWith('steering')) return '已注入';
      if (kind === 'user_question') return '已提交';
      if (kind === 'interrupt') return '已打断';
      if (kind === 'stop') return '已终止';
      if (authStatus === 'pending') return '等待授权';
      if (authStatus === 'approved') return '已授权';
      if (authStatus === 'denied') return '已拒绝';
      if (eventFailure(entry)) return '需注意';
      if (context.running && context.active && context.latest) return '进行中';
      return '已完成';
    }

    function eventLabel(entry) {
      const kind = eventKind(entry);
      if (kind === 'tool_call') return eventTool(entry).toUpperCase();
      if (kind === 'steering') return 'STEERING';
      if (kind === 'user_question') return 'USER QUESTION';
      if (kind.startsWith('authorization')) return 'AUTHORIZATION';
      if (kind === 'result') return 'OUTPUT';
      if (kind === 'error') return 'ERROR';
      return kind.replace(/_/g, ' ').toUpperCase();
    }

    function EventDetail({ entry }) {
      const kind = eventKind(entry);
      if (kind === 'tool_call') {
        const record = entry?.data?.record || {};
        const result = record.result || {};
        return (
          <div className="bg-paper border border-linen/60 p-2 text-[10px] leading-relaxed">
            <div className="flex flex-wrap gap-2 mb-1.5 text-warmgray"><span>工具：{eventTool(entry)}</span><span>状态：{result.state_classification || result.status || '未知'}</span>{result.duration_ms && <span>耗时：{result.duration_ms}ms</span>}</div>
            <div className="whitespace-pre-wrap break-words">{result.content || result.error || '无文本输出'}</div>
            {(result.verification || result.change || result.permission) && <pre className="mt-2 max-h-40 overflow-auto whitespace-pre-wrap break-words">{JSON.stringify({ permission: result.permission, change: result.change, verification: result.verification }, null, 2)}</pre>}
          </div>
        );
      }
      if (kind.startsWith('steering')) {
        return <div className="bg-paper border border-gold/20 p-2 text-[10px] text-ink whitespace-pre-wrap">{entry?.data?.content || entry?.summary}</div>;
      }
      if (kind === 'user_question') {
        return <div className="bg-paper border border-linen/60 p-2 text-[10px] text-ink whitespace-pre-wrap">{entry?.data?.content || entry?.summary}</div>;
      }
      if (kind === 'interrupt' || kind === 'stop') {
        return <div className="bg-paper border border-linen/60 p-2 text-[10px] text-ink whitespace-pre-wrap">{entry?.summary}</div>;
      }
      if (kind === 'result' || kind === 'error') {
        return <div className="bg-paper border border-linen/60 p-2 text-[10px] text-ink whitespace-pre-wrap">{entry?.summary || entry?.data?.result?.summary || entry?.data?.result?.error}</div>;
      }
      if (entry?.data) return <div className="bg-paper border border-linen/60 p-2"><PhaseDetail phase={entry.phase} data={entry.data} /></div>;
      return null;
    }

    function PhaseBlock({ phases, activePhase, completedPhases, running = false, onSteer, steeringCount = 0 }) {
      const [expandedPhases, setExpandedPhases] = useState({});
      const [expandedDetail, setExpandedDetail] = useState(new Set());
      const [steerTarget, setSteerTarget] = useState('');
      const [steerDraft, setSteerDraft] = useState('');
      const [steerBusy, setSteerBusy] = useState(false);
      const [steerError, setSteerError] = useState('');

      const normalized = useMemo(() => {
        let current = '';
        return (phases || []).map((entry, idx) => {
          const phase = canonicalPhase(entry.phase, current);
          if (PHASE_LABELS[phase]) current = phase;
          return { ...entry, phase, id: entry.id || (phase + '-' + idx) };
        });
      }, [phases]);

      const groups = useMemo(() => {
        const grouped = new Map();
        normalized.forEach(entry => {
          const list = grouped.get(entry.phase) || [];
          list.push(entry);
          grouped.set(entry.phase, list);
        });
        const known = PHASES.map(phase => ({ ...phase, events: grouped.get(phase.id) || [] })).filter(group => group.events.length > 0);
        const knownIds = new Set(PHASES.map(phase => phase.id));
        const unknown = [...grouped.entries()].filter(([phase]) => !knownIds.has(phase)).map(([phase, events]) => ({
          id: phase, icon: PHASE_ICONS[phase] || '•', label: PHASE_LABELS[phase] || phase, subtitle: '运行事件', events,
        }));
        return [...known, ...unknown];
      }, [normalized]);

      const togglePhase = (phase, defaultOpen) => {
        setExpandedPhases(prev => ({ ...prev, [phase]: !(prev[phase] ?? defaultOpen) }));
      };
      const toggleDetail = (id) => {
        setExpandedDetail(prev => {
          const next = new Set(prev);
          if (next.has(id)) next.delete(id); else next.add(id);
          return next;
        });
      };
      const submitSteer = async (event, entry) => {
        event.preventDefault();
        if (!steerDraft.trim() || steerBusy || !onSteer) return;
        setSteerBusy(true); setSteerError('');
        try {
          const sent = await onSteer(steerDraft.trim(), entry);
          if (!sent) throw new Error('插话未送达，运行可能已经结束');
          setSteerDraft(''); setSteerTarget('');
        } catch (error) {
          setSteerError(error?.message || '插话未送达');
        } finally { setSteerBusy(false); }
      };

      if (!groups.length && !activePhase) return null;
      return (
        <div className="praxic-phase-stream">
          <div className="praxic-phase-stream__head"><strong>认知过程 / 显式事件流</strong><small>{normalized.length} 条事件 · 当前阶段默认展开</small></div>
          {groups.map(group => {
            const pending = group.events.some(entry => eventStatus(entry) === '等待授权');
            const failed = group.events.some(eventFailure);
            const isActive = running && group.id === activePhase;
            const status = pending ? 'waiting' : failed ? 'error' : isActive ? 'active' : 'done';
            const defaultOpen = isActive || pending || failed;
            const open = expandedPhases[group.id] ?? defaultOpen;
            const actions = group.events.filter(entry => ['tool_call', 'steering'].includes(eventKind(entry)) || eventKind(entry).startsWith('authorization')).length || group.events.length;
            const last = group.events[group.events.length - 1];
            const showSummary = group.id !== 'preprocessing';
            return (
              <section key={group.id} className={'praxic-phase-group praxic-phase-group--' + status + (open ? ' praxic-phase-group--open' : '')}>
                <button type="button" className="praxic-phase-group__header" onClick={() => togglePhase(group.id, defaultOpen)} aria-expanded={open}>
                  <span className="praxic-phase-group__icon" aria-hidden="true" />
                  <span className="praxic-phase-group__title"><strong>{group.label}<small>{' · '}{group.subtitle}</small></strong></span>
                  <span className="praxic-phase-group__meta"><strong>{String(actions).padStart(2, '0')}</strong><small>{status === 'active' ? '进行中' : status === 'waiting' ? '等待授权' : status === 'error' ? '需注意' : '已完成'}</small></span>
                  <span className="praxic-phase-group__summary">{showSummary ? (last?.summary || '等待进入') : ''}</span>
                  <span className="praxic-phase-group__chevron">{open ? '−' : '+'}</span>
                </button>
                {open && <div className="praxic-phase-group__events">
                  {group.events.map((entry, idx) => {
                    const key = entry.id || (group.id + '-' + idx);
                    const kind = eventKind(entry);
                    const selected = expandedDetail.has(key);
                    return (
                          <div key={key} className={'praxic-event-wrap ' + (selected ? 'praxic-event-wrap--selected ' : '') + (kind === 'tool_call' ? 'praxic-event-wrap--tool ' : '') + (kind.startsWith('authorization') ? 'praxic-event-wrap--authorization ' : '') + (kind.startsWith('steering') ? 'praxic-event-wrap--steering ' : '') + (eventFailure(entry) ? 'praxic-event-wrap--error' : '')}>
                        <div className="praxic-event-row" role="button" tabIndex="0" onClick={() => toggleDetail(key)} onKeyDown={e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleDetail(key); } }}>
                          <span className="praxic-event-index">{String(idx + 1).padStart(2, '0')}</span>
                          <span className="praxic-event-marker" />
                          <span className="praxic-event-copy"><span className="praxic-event-copy__line"><small>{eventLabel(entry)}</small><strong>{entry.summary || '状态已更新'}</strong></span></span>
                          <span className="praxic-event-status">{eventStatus(entry, { running, active: isActive, latest: idx === group.events.length - 1 })}</span>
                          {running && onSteer && kind !== 'steering' && <button type="button" className="praxic-event-steer" onClick={e => { e.stopPropagation(); setSteerTarget(key); setSteerError(''); }}>插话</button>}
                          <span className="praxic-event-arrow">↗</span>
                        </div>
                        {steerTarget === key && running && onSteer && <form className="praxic-inline-steer" onSubmit={e => submitSteer(e, entry)}>
                          <div className="praxic-inline-steer__head"><strong>在此小循环后插话</strong><small>{steeringCount ? `此前 ${steeringCount} 条会继续携带` : '插话会进入后续小循环'}</small></div>
                          <textarea value={steerDraft} onChange={e => setSteerDraft(e.target.value)} autoFocus rows="2" placeholder="补充事实、修正方向，或提出下一步问题…" />
                          <div className="praxic-inline-steer__actions">{steerError && <span className="praxic-inline-steer__error">{steerError}</span>}<button type="button" className="praxic-inline-steer__cancel" onClick={() => setSteerTarget('')}>取消</button><button type="submit" className="praxic-inline-steer__submit" disabled={steerBusy || !steerDraft.trim()}>{steerBusy ? '发送中…' : '注入 steering'}</button></div>
                        </form>}
                        {selected && entry.data && <div className="ml-8 mr-2 mb-2"><EventDetail entry={entry} /></div>}
                      </div>
                    );
                  })}
                </div>}
              </section>
            );
          })}
        </div>
      );
    }

    function AuthorizationPanel({ request, busy, error, onResolve }) {
      if (!request) return null;
      const pending = request.status === 'pending';
      return (
        <div className="praxic-authorization px-4 py-3 bg-cream">
          <div className="max-w-3xl mx-auto border border-seal/40 bg-seal-wash px-4 py-3">
            <div className="flex items-start justify-between gap-4">
              <div className="min-w-0">
                <div className="text-[10px] font-semibold text-seal uppercase tracking-wide">行动授权</div>
                <div className="mt-1 text-sm font-semibold text-ink">{request.tool_name || '外部行动'}</div>
                <div className="mt-1 text-xs text-warmgray leading-relaxed">{request.reason || '该行动需要你的确认后才能继续。'}</div>
                {request.scope && <div className="mt-1 text-[10px] text-warmgray truncate">范围：{request.scope}</div>}
              </div>
              <span className={'flex-shrink-0 px-2 py-1 text-[10px] font-semibold ' + (pending ? 'bg-gold text-white' : 'bg-olive text-white')}>
                {request.status || 'pending'}
              </span>
            </div>
            {request.parameters && Object.keys(request.parameters).length > 0 && (
              <details className="mt-2 text-[10px] text-warmgray">
                <summary className="cursor-pointer hover:text-ink">查看调用参数</summary>
                <pre className="mt-1 max-h-32 overflow-auto whitespace-pre-wrap break-words bg-paper border border-linen/60 p-2">{JSON.stringify(request.parameters, null, 2)}</pre>
              </details>
            )}
            {pending && (
              <div className="mt-3 flex gap-2">
                <button onClick={() => onResolve(request, 'approve')} disabled={busy === request.request_id}
                  className="px-4 py-2 bg-seal text-white text-xs font-semibold disabled:opacity-50">批准</button>
                <button onClick={() => onResolve(request, 'deny')} disabled={busy === request.request_id}
                  className="px-4 py-2 bg-ink text-white text-xs font-semibold disabled:opacity-50">拒绝</button>
              </div>
            )}
            {error && <div className="mt-2 text-xs text-red-700">{error}</div>}
          </div>
        </div>
      );
    }

    // ── InputBar ──────────────────────────────────────────────
    function UserActionIcon({ kind }) {
      if (kind === 'edit') {
        return (
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 16.5V20h3.5L18.8 8.7a2.1 2.1 0 0 0-3-3L4 16.5z" />
            <path d="m14.5 7.5 2 2" />
          </svg>
        );
      }
      if (kind === 'resend') {
        return (
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 11a8 8 0 0 0-13.7-5.7L4 7.6" />
            <path d="M4 4.2v3.4h3.4" />
            <path d="M4 13a8 8 0 0 0 13.7 5.7L20 16.4" />
            <path d="M20 19.8v-3.4h-3.4" />
          </svg>
        );
      }
      if (kind === 'cancel') {
        return (
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m6 6 12 12" />
            <path d="m18 6-12 12" />
          </svg>
        );
      }
      if (kind === 'send') {
        return (
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m4 12 16-8-4 16-4.5-6.5L4 12z" />
            <path d="M11.5 13.5 20 4" />
          </svg>
        );
      }
      return (
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="8" y="8" width="11" height="11" rx="1" />
          <path d="M16 8V5.5A1.5 1.5 0 0 0 14.5 4h-9A1.5 1.5 0 0 0 4 5.5v9A1.5 1.5 0 0 0 5.5 16H8" />
        </svg>
      );
    }

    function UserMessageActions({ turn, onEdit, onResend, onCopy, copied, busy }) {
      if (!turn || turn.steer) return null;
      return (
        <div className="praxic-user-actions" aria-label="消息操作">
          <button type="button" onClick={() => onEdit(turn)} disabled={busy} title="重新编辑并发送" aria-label="重新编辑并发送"><UserActionIcon kind="edit" /></button>
          <button type="button" onClick={() => onResend(turn)} disabled={busy} title="直接重新发送" aria-label="直接重新发送"><UserActionIcon kind="resend" /></button>
          <button type="button" onClick={() => onCopy(turn)} title={copied ? '已复制消息' : '复制消息'} aria-label={copied ? '已复制消息' : '复制消息'}>{copied ? <span className="praxic-user-action-check" aria-hidden="true">✓</span> : <UserActionIcon kind="copy" />}</button>
        </div>
      );
    }

    function InlineUserEditor({ turn, onCancel, onSend }) {
      const [question, setQuestion] = useState(turn?.question || '');
      const [sending, setSending] = useState(false);
      const textareaRef = useRef(null);

      const resizeTextarea = useCallback(() => {
        const textarea = textareaRef.current;
        if (!textarea) return;
        textarea.style.height = 'auto';
        textarea.style.height = `${Math.min(Math.max(textarea.scrollHeight, 41), 224)}px`;
      }, []);

      useEffect(() => {
        const frame = requestAnimationFrame(() => {
          resizeTextarea();
          const textarea = textareaRef.current;
          if (textarea) {
            textarea.focus();
            textarea.setSelectionRange(textarea.value.length, textarea.value.length);
          }
        });
        return () => cancelAnimationFrame(frame);
      }, [resizeTextarea]);

      const submit = useCallback(() => {
        const value = question.trim();
        if (!value || sending) return;
        setSending(true);
        onSend(
          value,
          String(turn?.context || '').trim(),
          turn?.mode || 'deep',
          turn?.reviewStrategy || 'off',
          turn?.model || '',
          turn?.files || [],
        );
      }, [question, sending, onSend, turn]);

      const handleKeyDown = useCallback((event) => {
        if (event.key === 'Escape') {
          event.preventDefault();
          onCancel();
          return;
        }
        if (event.key === 'Enter' && (event.ctrlKey || event.metaKey)) {
          event.preventDefault();
          submit();
        }
      }, [onCancel, submit]);

      const files = Array.isArray(turn?.files) ? turn.files : [];
      return (
        <div className="praxic-inline-editor">
          <textarea
            ref={textareaRef}
            value={question}
            onChange={event => { setQuestion(event.target.value); resizeTextarea(); }}
            onKeyDown={handleKeyDown}
            rows={1}
            aria-label="编辑问题"
            placeholder="编辑问题…"
          />
          {turn?.context && (
            <div className="praxic-inline-editor__context">
              <span className="praxic-inline-editor__context-label">背景</span>{turn.context}
            </div>
          )}
          {files.length > 0 && (
            <div className="praxic-inline-editor__files" aria-label="附件">
              {files.map((file, index) => (
                <span key={index} className="praxic-inline-editor__file">📎 {file.name || file.path || file}</span>
              ))}
            </div>
          )}
          <div className="praxic-inline-editor__footer">
            <span className="praxic-inline-editor__hint">Ctrl/Cmd + Enter 发送</span>
            <button type="button" className="praxic-inline-editor__button" onClick={onCancel} title="取消编辑" aria-label="取消编辑">
              <UserActionIcon kind="cancel" />
            </button>
            <button type="button" className="praxic-inline-editor__button" onClick={submit} disabled={!question.trim() || sending} title="发送编辑后的消息" aria-label="发送编辑后的消息">
              <UserActionIcon kind="send" />
            </button>
          </div>
        </div>
      );
    }

    function InputBar({ onSend, running, onStop, onSteer, model, availableModels, onModelChange, files, setFiles, uploading, handleFiles, awaitingClarification, onAnswer }) {
      const [question, setQuestion] = useState('');
      const [context, setContext] = useState('');
      const [mode, setMode] = useState('deep');
      const [reviewStrategy, setReviewStrategy] = useState('off');
      const [showContext, setShowContext] = useState(false);
      const fileRef = useRef(null);

      const handleSend = useCallback(() => {
        if (awaitingClarification) {
          onAnswer?.(question.trim());   // 空串＝跳过
          setQuestion(''); setContext('');
          return;
        }
        if (!question.trim()) return;
        if (running) {
          onSteer?.(question.trim());
        } else {
          onSend(question.trim(), context.trim(), mode, reviewStrategy, model, files);
        }
        setQuestion('');
        setContext('');
        setFiles([]);
      }, [question, context, mode, reviewStrategy, model, running, onSend, onSteer, files, awaitingClarification, onAnswer, setFiles]);

      const handleKeyDown = useCallback(e => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); }
      }, [handleSend]);

      return (
        <div className="praxic-inputbar border-t border-linen/60 bg-cream px-4 py-3">
          {!running && files.length > 0 && (
            <div className="flex flex-wrap gap-1 mb-2">
              {files.map((f, i) => (
                <span key={i} className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-dust/70 text-[10px] text-warmgray">
                  📎 <span className="truncate max-w-[140px]" title={f.path}>{f.name}</span>
                  <span onClick={() => setFiles(prev => prev.filter((_, j) => j !== i))} className="cursor-pointer text-clay hover:text-seal">×</span>
                </span>
              ))}
            </div>
          )}
          <div className="flex items-end gap-2">
            <textarea value={question} onChange={e => setQuestion(e.target.value)} onKeyDown={handleKeyDown}
              placeholder={awaitingClarification ? "回答即物穷理的问题…（Enter 发送，留空＝跳过）" : running ? (question.trim() ? "输入插话内容…（Enter 发送）" : "点击终止或输入内容插话…") : "提出一个问题…（Enter 发送，Shift+Enter 换行）"}
              rows={1}
              className="flex-1 resize-none bg-paper border border-linen/60 rounded-lg px-4 py-2.5 text-sm text-ink placeholder:text-clay focus:outline-none focus:border-seal/50 focus:ring-1 focus:ring-seal/20" />
            {awaitingClarification ? (
              <>
                <button onClick={handleSend} className="px-5 py-2.5 rounded-lg bg-seal text-white text-sm font-semibold hover:bg-seal-light flex-shrink-0">回答 →</button>
                <button onClick={onStop} className="px-4 py-2.5 rounded-lg bg-warmgray text-white text-sm font-semibold hover:bg-warmgray/80 flex-shrink-0">⛔ 终止</button>
              </>
            ) : running ? (
              question.trim() ? (
                <button onClick={handleSend} className="px-4 py-2.5 rounded-lg bg-olive text-white text-sm font-semibold hover:bg-olive/80 flex-shrink-0">插话 →</button>
              ) : (
                <button onClick={onStop} className="px-4 py-2.5 rounded-lg bg-warmgray text-white text-sm font-semibold hover:bg-warmgray/80 flex-shrink-0">⏹ 终止</button>
              )
            ) : (
              <button onClick={handleSend} disabled={!question.trim()} className="px-5 py-2.5 rounded-lg bg-seal text-white text-sm font-semibold hover:bg-seal-light disabled:opacity-40 flex-shrink-0">→ 发送</button>
            )}
          </div>
          <div className="flex items-center gap-2 mt-1.5">
            <button onClick={() => setShowContext(!showContext)} className="text-xs text-warmgray hover:text-seal">{showContext ? '收起' : '+ 背景'}</button>
            <input ref={fileRef} type="file" multiple className="hidden" onChange={e => { handleFiles(e.target.files); e.target.value = ''; }} />
            <button onClick={() => fileRef.current && fileRef.current.click()} disabled={running || uploading}
              className="text-xs text-warmgray hover:text-seal disabled:opacity-40" title="上传文件（作为本轮提问的资料）">{uploading ? '上传中…' : '📎 附件'}</button>
            {showContext && (
              <input value={context} onChange={e => setContext(e.target.value)} placeholder="背景上下文（可选）"
                className="flex-1 bg-paper border border-linen/40 rounded px-2 py-1 text-xs text-ink placeholder:text-clay focus:outline-none focus:border-seal/40" />
            )}
            <select value={mode} onChange={e => setMode(e.target.value)}
              className="bg-paper border border-linen/40 rounded px-1.5 py-1 text-[11px] text-warmgray focus:outline-none">
              <option value="fast">快速</option>
              <option value="standard">标准</option>
              <option value="deep">深度</option>
            </select>
            <select value={reviewStrategy} onChange={e => setReviewStrategy(e.target.value)}
              className="bg-paper border border-linen/40 rounded px-1.5 py-1 text-[11px] text-warmgray focus:outline-none" title="多视角审查策略">
              <option value="off">不审查</option>
              <option value="once">审查·首轮</option>
              <option value="iterative">审查·迭代</option>
            </select>
            {availableModels && availableModels.length > 0 && (
              <select value={model} onChange={e => onModelChange?.(e.target.value)}
                className="bg-paper border border-linen/40 rounded px-1.5 py-1 text-[11px] text-warmgray focus:outline-none focus:border-seal/40" title="选择模型">
                {availableModels.map(m => <option key={m} value={m}>{m}</option>)}
              </select>
            )}
          </div>
        </div>
      );
    }

    // ── Phase Detail renderers ───────────────────────────────
    function InvestigationDetail({ data }) {
      const facts = data?.facts || [];
      const gaps = data?.gaps || [];
      const credColors = v => v >= 0.8 ? 'bg-olive text-white' : v >= 0.5 ? 'bg-gold/80 text-white' : 'bg-clay text-ink';
      const impColors = v => v === 'high' ? 'bg-seal text-white' : v === 'medium' ? 'bg-gold/80 text-white' : 'bg-clay text-ink';
      return (
        <div className="space-y-2 text-xs">
          {facts.length > 0 && <div><div className="font-semibold text-olive mb-1">📋 事实 ({facts.length})</div>
            {facts.map((f,i) => <div key={i} className="bg-dust/60 rounded p-2 mb-1"><span className="text-ink">• {f.content}</span>
              <div className="flex gap-1.5 mt-1"><span className="px-1 py-0.5 rounded text-[9px] bg-paper border text-warmgray">{f.source_type||'unknown'}</span>
                <span className={'px-1 py-0.5 rounded text-[9px] ' + credColors(f.credibility)}>可信{Math.round((f.credibility||0.5)*100)}%</span></div></div>)}
          </div>}
          {gaps.length > 0 && <div><div className="font-semibold text-seal mb-1">❓ 缺口 ({gaps.length})</div>
            {gaps.map((g,i) => <div key={i} className="bg-seal-wash rounded p-2 mb-1"><span className={'px-1 py-0.5 rounded text-[9px] mr-1 ' + impColors(g.importance)}>{g.importance==='high'?'高':g.importance==='medium'?'中':'低'}</span><span className="text-ink">{g.description}</span>
              {g.suggested_query && <div className="text-[10px] text-warmgray mt-1">🔍 {g.suggested_query}</div>}</div>)}
          </div>}
        </div>);
    }

    function ContradictionDetail({ data }) {
      const pc = data?.principal_contradiction; const sc = data?.secondary_contradictions || [];
      const cgd = data?.contradiction_derivation; // overall derivation chain

      // Helper: render a single derivation chain
      function DerivationChainView({ chain, label, color }) {
        if (!chain || !(chain.steps||[]).length) return null;
        return (
          <div className="mt-2 pt-2 border-t border-linen/30">
            <div className="text-[11px] font-semibold text-warmgray mb-1.5">{label || '推导链'}</div>
            {chain.summary && <p className="text-[10px] text-warmgray italic mb-1.5">{chain.summary}</p>}
            {chain.factual_foundation && chain.factual_foundation.length > 0 && (
              <div className="flex flex-wrap gap-1 mb-2">
                {chain.factual_foundation.map((f,i) => <span key={i} className="px-1.5 py-0.5 rounded text-[9px] bg-dust/60 text-warmgray">{typeof f === 'string' ? f : (f.content || f)}</span>)}
              </div>
            )}
            <div className="space-y-1.5">
              {chain.steps.map((s,i) => (
                <div key={s.step_id || i} className="flex items-start gap-2 relative">
                  {/* Vertical connector line */}
                  {i < chain.steps.length - 1 && <div className="absolute left-[7px] top-5 bottom-0 w-0.5 bg-clay/30" />}
                  <div className={`w-3.5 h-3.5 rounded-full flex items-center justify-center flex-shrink-0 mt-0.5 text-[8px] text-white ${(s.confidence||0.7) >= 0.8 ? 'bg-olive' : (s.confidence||0.7) >= 0.5 ? 'bg-gold' : 'bg-clay'}`}
                    title={`置信度 ${Math.round((s.confidence||0.7)*100)}%`}>{i+1}</div>
                  <div className="flex-1 min-w-0">
                    {s.conclusion && <div className="text-[11px] text-ink font-medium">{s.conclusion}</div>}
                    {s.inference && <div className="text-[10px] text-warmgray mt-0.5 leading-relaxed">推理：{s.inference}</div>}
                    {(s.fact_basis||[]).length > 0 && (
                      <div className="flex flex-wrap gap-0.5 mt-1">
                        {(s.fact_basis||[]).map((f,j) => <span key={j} className="px-1 rounded text-[8px] bg-paper border text-clay/70">{typeof f === 'string' ? f : (f.content || f)}</span>)}
                      </div>
                    )}
                    <div className="flex items-center gap-2 mt-0.5">
                      <span className={`text-[8px] px-1 rounded ${(s.confidence||0.7) >= 0.8 ? 'bg-olivewash text-olive' : (s.confidence||0.7) >= 0.5 ? 'bg-gold/10 text-gold' : 'bg-clay/20 text-clay'}`}>
                        置信度 {Math.round((s.confidence||0.7)*100)}%
                      </span>
                      {s.reversible && <span className="text-[8px] text-clay">可修正</span>}
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        );
      }

      return (<div className="space-y-3 text-xs">
        {/* Overall derivation chain if present */}
        {cgd && (cgd.steps||[]).length > 0 && (
          <DerivationChainView chain={cgd} label="📐 矛盾分析整体推导" color="olive" />
        )}
        {/* Principal contradiction */}
        {pc && <div className="bg-seal-wash border border-seal/20 rounded p-2">
          <div className="font-semibold text-seal mb-1">⚡ 主要矛盾</div>
          <p className="text-ink">{pc.description}</p>
          {(pc.tension_poles||[]).length>0 && <div className="flex flex-wrap gap-1 mt-1.5">{pc.tension_poles.map((p,i)=><span key={i} className="px-1.5 py-0.5 rounded-full bg-paper border text-[10px] text-warmgray">{p}</span>)}</div>}
          {pc.primary_aspect && <p className="text-[10px] text-warmgray mt-1">主要方面：{pc.primary_aspect}</p>}
          {pc.particularity_description && (
            <p className="text-[10px] text-warmgray mt-1.5 border-t border-seal/10 pt-1.5 leading-relaxed">
              <span className="font-semibold">特殊性：</span>{pc.particularity_description}
            </p>
          )}
          {pc.transformation_condition && <p className="text-[10px] text-seal mt-1">转化条件：{pc.transformation_condition}</p>}
          <DerivationChainView chain={pc.derivation_chain} label="推导过程" color="seal" />
        </div>}
        {/* Secondary contradictions */}
        {sc.length>0 && <div>
          <div className="font-semibold text-gold mb-1.5">次要矛盾 ({sc.length})</div>
          {sc.map((c,i) => (
            <div key={i} className="bg-dust/60 rounded p-1.5 text-[11px] mb-1.5">
              <span className="text-ink">{c.description}</span>
              {(c.tension_poles||[]).length>0 && <div className="flex flex-wrap gap-1 mt-1">{c.tension_poles.map((p,j)=><span key={j} className="px-1 py-0.5 rounded-full bg-paper border text-[9px] text-warmgray">{p}</span>)}</div>}
              {c.particularity_description && <p className="text-[9px] text-warmgray mt-1 leading-relaxed"><span className="font-semibold">特殊性：</span>{c.particularity_description}</p>}
              <DerivationChainView chain={c.derivation_chain} label="" color="gold" />
            </div>
          ))}
        </div>}
        {/* Position shifts if any */}
        {(data?.position_shifts||[]).length > 0 && (
          <div className="bg-gold/5 border border-gold/20 rounded p-2">
            <div className="font-semibold text-gold mb-1 text-[10px]">📈 矛盾地位转换</div>
            {data.position_shifts.map((ps,i) => (
              <div key={i} className="text-[10px] text-warmgray mb-0.5">
                {ps.contradiction_description?.slice(0,80)}：{ps.from_role} → {ps.to_role}
                {ps.trigger_iteration > 0 && <span className="text-clay ml-1">（第{ps.trigger_iteration}轮）</span>}
              </div>
            ))}
          </div>
        )}
      </div>);
    }

    function RationalDetail({ data }) {
      const d=data||{};
      return (<div className="space-y-2 text-xs">
        {d.essence && <div className="bg-olivewash border border-olive/20 rounded p-2"><div className="font-semibold text-olive mb-1">💡 本质</div><p className="text-ink">{d.essence}</p></div>}
        {(d.patterns||[]).length>0 && <div>{d.patterns.map((p,i)=><div key={i} className="text-warmgray pl-2 border-l-2 border-olive/30 mb-0.5">• {p}</div>)}</div>}
        {(d.hypotheses||[]).length>0 && <div><div className="font-semibold text-gold mb-1">🧪 假设</div>{d.hypotheses.map((h,i)=><div key={i} className="text-warmgray pl-2 border-l-2 border-gold/30 mb-0.5">• {h}</div>)}</div>}
        {d.qualitative_threshold && <p className="text-[10px] text-seal">临界点：{d.qualitative_threshold}</p>}
      </div>);
    }

    function DecisionDetail({ data }) {
      const d=data||{}; const actions=d.action_items||[];
      return (<div className="space-y-2 text-xs">
        {d.strategic_assessment && <div className="bg-olivewash border border-olive/20 rounded p-2"><div className="font-semibold text-olive mb-1">🎯 战略</div><p className="text-ink">{d.strategic_assessment}</p></div>}
        {actions.length>0 && <div><div className="font-semibold text-seal mb-1">📋 行动 ({actions.length})</div>
          {actions.map((a,i)=><div key={i} className="bg-paper border rounded p-1.5 mb-1"><span className="px-1 py-0.5 rounded text-[9px] bg-seal text-white mr-1">P{a.priority||i+1}</span><span className="text-ink font-medium">{a.description}</span>
            {a.expected_outcome && <div className="text-[10px] text-olive mt-0.5">✓ {a.expected_outcome}</div>}</div>)}</div>}
        {(d.risks||[]).length>0 && <div>{d.risks.map((r,i)=><div key={i} className="text-seal-light pl-2 border-l-2 border-seal/30 mb-0.5">• {r}</div>)}</div>}
      </div>);
    }

    function PerspectivesDetail({ data }) {
      const d=data||{}; const views=d.views||[];
      return (<div className="space-y-2 text-xs">
        {d.synthesized_insight && <p className="text-warmgray italic">{d.synthesized_insight}</p>}
        {(d.critical_warnings||[]).length>0 && <div><div className="font-semibold text-seal mb-1">🚨 警告</div>{d.critical_warnings.map((w,i)=><div key={i} className="text-seal bg-seal-wash rounded px-2 py-1 mb-0.5">⚠ {w}</div>)}</div>}
        {views.length>0 && <div><div className="font-semibold text-olive mb-1">👥 视角 ({views.length})</div>{views.map((v,i)=><div key={i} className="bg-paper border rounded p-1.5 mb-1"><span className="font-semibold text-ink">{v.perspective_name}</span><p className="text-warmgray mt-0.5">{v.critique}</p></div>)}</div>}
      </div>);
    }

    function PracticeDetail({ data }) {
      const d=data||{}; const steps=d.steps_taken||[];
      return (<div className="space-y-2 text-xs">
        {d.practice_summary && <p className="text-warmgray italic">{d.practice_summary}</p>}
        {steps.length>0 && <div>{steps.map((s,i)=><div key={i} className="bg-paper border rounded p-1.5 mb-1"><div className="font-medium text-ink">步骤{i+1}: {s.description}</div>
          {s.observed_result && <div className={'mt-0.5 px-1.5 py-0.5 rounded text-[10px] '+(s.matched_expectation!==false?'bg-olivewash text-olive':'bg-seal-wash text-seal')}>📊 {s.observed_result}</div>}</div>)}</div>}
        {(d.unexpected_findings||[]).length>0 && <div>{d.unexpected_findings.map((f,i)=><div key={i} className="text-seal-light pl-2 border-l-2 border-seal/30 mb-0.5">• {f}</div>)}</div>}
      </div>);
    }

    function ReflectionDetail({ data }) {
      const d=data||{};
      return (<div className="space-y-2 text-xs">
        <div className="flex flex-wrap gap-1.5">
          <span className="px-1.5 py-0.5 rounded-full bg-olivewash text-[10px] text-olive">收敛 {((d.convergence_score||0)*100).toFixed(0)}%</span>
          <span className="px-1.5 py-0.5 rounded-full bg-gold/10 text-[10px] text-gold">{d.understanding_level||'感性'}</span>
          {d.qualitative_leap && <span className="px-1.5 py-0.5 rounded-full bg-seal-wash text-[10px] text-seal">质变飞跃</span>}
          {d.should_reinvestigate && <span className="px-1.5 py-0.5 rounded-full bg-seal-wash text-[10px] text-seal">建议再调查</span>}
        </div>
        {d.quality_assessment && <p className="text-warmgray">{d.quality_assessment}</p>}
        {(d.lessons_learned||[]).length>0 && <div>{d.lessons_learned.map((l,i)=><div key={i} className="text-warmgray pl-2 border-l-2 border-olive/30 mb-0.5">• {l}</div>)}</div>}
        {(d.cognitive_biases_found||[]).length>0 && <div>{d.cognitive_biases_found.map((b,i)=><div key={i} className="text-seal-light pl-2 border-l-2 border-seal/30 mb-0.5">• {b}</div>)}</div>}
        {d.reinvestigation_focus && <p className="text-warmgray italic">🔍 焦点：{d.reinvestigation_focus}</p>}
      </div>);
    }

    function PreprocessingDetail({ data }) {
      const domains = data?.question_domains || [];
      const subQs = data?.structured_sub_questions || [];
      return (
        <div className="space-y-2 text-xs">
          {data?.expanded_question && (
            <div>
              <div className="font-semibold text-seal mb-1">📝 结构化问题</div>
              <div className="bg-dust/60 rounded p-2 text-ink leading-relaxed">{data.expanded_question}</div>
            </div>
          )}
          {data?.question_intent && (
            <div>
              <div className="font-semibold text-olive mb-1">🎯 意图识别</div>
              <div className="bg-dust/60 rounded p-2 text-ink">{data.question_intent}</div>
            </div>
          )}
          {data?.contradiction_in_question && (
            <div>
              <div className="font-semibold text-seal mb-1">⚡ 问题中的矛盾</div>
              <div className="bg-dust/60 rounded p-2 text-ink leading-relaxed">{data.contradiction_in_question}</div>
            </div>
          )}
          {data?.core_anxiety && (
            <div>
              <div className="font-semibold text-warmgray mb-1">💭 深层关切</div>
              <div className="bg-dust/60 rounded p-2 text-ink">{data.core_anxiety}</div>
            </div>
          )}
          {domains.length > 0 && (
            <div>
              <div className="font-semibold text-olive mb-1">🌐 关联领域</div>
              <div className="flex flex-wrap gap-1">
                {domains.map((d, i) => <span key={i} className="px-2 py-0.5 rounded-full text-[10px] bg-seal-wash text-seal border border-seal/20">{d}</span>)}
              </div>
            </div>
          )}
          {subQs.length > 0 && (
            <div>
              <div className="font-semibold text-olive mb-1">🔍 拆解子问题</div>
              <div className="space-y-1">
                {subQs.map((q, i) => (
                  <div key={i} className="flex gap-2 bg-dust/60 rounded p-2">
                    <span className="text-seal font-semibold flex-shrink-0">{i + 1}.</span>
                    <span className="text-ink">{q}</span>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    function PhaseDetail({ phase, data }) {
      if (!data) return null;
      switch (phase) {
        case 'preprocessing': return <PreprocessingDetail data={data} />;
        case 'investigation': return <InvestigationDetail data={data} />;
        case 'contradiction':  return <ContradictionDetail data={data} />;
        case 'rational':       return <RationalDetail data={data} />;
        case 'perspectives':   return <PerspectivesDetail data={data} />;
        case 'practice':       return <PracticeDetail data={data} />;
        case 'reflection':     return <ReflectionDetail data={data} />;
        default: return null;
      }
    }

    // ── DevTracePanel ────────────────────────────────────────
    function DevTracePanel({ records }) { /* kept for dev mode */ return null; }

    function ResultPanel({ summary, actions }) {
      if (!summary) return null;
      return (
        <div className="p-3 bg-olivewash border border-olive/20 rounded-lg text-xs">
          <div className="font-semibold text-olive mb-1">📝 结论</div>
          <div className="text-ink whitespace-pre-wrap leading-relaxed">{summary}</div>
          {actions && actions.length > 0 && (
            <div className="mt-2">
              <div className="font-semibold text-olive mb-1">✅ 行动建议</div>
              {actions.map((a,i) => <div key={i} className="flex items-center gap-1.5 text-warmgray mb-0.5"><span className="w-4 h-4 rounded-full bg-olive text-white text-[9px] flex items-center justify-center">{i+1}</span> {a}</div>)}
            </div>
          )}
        </div>
      );
    }

    const FONT_FAMILIES = [
      { id: 'system', label: '系统默认', css: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif' },
      { id: 'serif',  label: '思源宋体 / 衬线', css: '"Noto Serif SC", "Source Han Serif SC", "STSong", Georgia, serif' },
      { id: 'mono',   label: '等宽 / 代码', css: '"JetBrains Mono", "Fira Code", "SF Mono", "Cascadia Code", Consolas, monospace' },
    ];
    const FONT_SIZES = [
      { id: 'small',  label: '小', css: '14px' },
